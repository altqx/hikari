# Tools that build the HikariSub NSIS installer (installers spec, 6.1).
# The same file on the legacy and Qt branches. KEY=VALUE lines, readable by
# bash (source) and by a line parser.

# NSIS, built by build-makensis.sh: the compiler from the source, the
# stubs, plug-ins and headers from the release zip. 3.11 or later: earlier
# releases have CVE-2025-43715 (an elevated installer's plug-ins folder can
# be created first by a local user, who plants a DLL in it). The SHA-256s
# are of the files SourceForge serves, whose SHA-1s match its listing.
MAKENSIS_VERSION=3.13
NSIS_ZIP_URL=https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip
NSIS_ZIP_SHA256=ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8
NSIS_SRC_URL=https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13-src.tar.bz2
NSIS_SRC_SHA256=a8ffe024602d46b6d766f9e1ce30c324ad2a24daeacd3efc2642d436a0c157ac

# StdUtils, for ExecShellAsUser (relaunching the app unelevated).
STDUTILS_VERSION=1.14
STDUTILS_URL=https://github.com/lordmulder/stdutils/releases/download/1.14/StdUtils.2018-10-27.zip
STDUTILS_SHA256=3ffe893dc7477fdb1cac551a86ae017509e1f2d0ebdc7185fd0fbaf20870688c
