# Windows build and test through Winix (a local Windows VM). The tasks run the
# same presets as .github/workflows/qt-windows.yml inside the latest MSVC
# environment. out/ (the SDK and build trees) stays in the VM between runs;
# it is git-ignored, so `winix sync` never copies it.
#
# Provisioning installs Qt with the official installer, which needs a Qt
# Account: log in once inside the VM (the installer then reuses that login).
# The CI secret QT_INSTALLER_JWT_TOKEN is never copied into the VM.
version: 1
image: windows-dev
workspace: hikari-qt
resources:
  cpus: 6
  memoryGiB: 12
  diskGiB: 180
# An ICH9 HDA endpoint on QEMU's silent backend (N6 audio tests write silence
# only) and two monitors for the D1 gate's mixed DPI and monitor removal
# (both approved by the user, 2026-10-04 and 2026-10-05).
vm: { audio: none, displays: 2 }
exclude: [.git, .winix, .env, '*.pfx', '*.key', out]
pipeline: [provision, build, test]
tasks:
  provision:
    script: ./tools/winix/msvc.ps1 cmake --workflow --preset provision
    timeoutSeconds: 7200
    artifacts: [out/build/provision/provision-evidence]
  build:
    script: ./tools/winix/msvc.ps1 cmake --workflow --preset windows-x64-release
    timeoutSeconds: 3600
    artifacts: [out/build/windows-x64-release/provision-evidence]
  test:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release --output-junit results.xml
    timeoutSeconds: 1200
    artifacts: [out/build/windows-x64-release/results.xml, out/build/windows-x64-release/Testing/Temporary/LastTest.log]
  shell:
    # Shell test functions one at a time (QtTest writes to a file), each limited to 90 s.
    script: $env:QT_QPA_PLATFORM = 'offscreen'; $env:PATH = "$PWD/out/sdk/qt-6.11.2-windows/6.11.2/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_shell_tests.exe out/build/windows-x64-release | Select-Object -First 1; foreach ($f in 'selectLinesDialogSelectsAndActs','saveVariantsFollowTheLegacySave','aboutAndCreditsShowTheNotices','resolutionMismatchAndResample','f6AndShortcutsReachAFloatingPanel') { $out = "$env:TEMP/shell-$f.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "$f -o $out,txt" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$env:TEMP/shell-err.txt"; if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Output "== $f TIMED OUT" } else { Write-Output "== $f exit $($p.ExitCode)" }; if (Test-Path $out) { Get-Content $out | Select-String -Pattern 'FAIL|Loc:|Actual|Expected|PASS|SKIP|QWARN|Totals' } }
    timeoutSeconds: 900
  automation-output:
    # The Lua helper tests (gtest) and the script dialog's QtTest functions with their output (L2, L6).
    script: $env:QT_QPA_PLATFORM = 'offscreen'; $env:PATH = "$PWD/out/sdk/qt-6.11.2-windows/6.11.2/msvc2022_64/bin;$env:PATH"; $b = 'out/build/windows-x64-release'; $lua = Get-ChildItem -Recurse -Filter hikari_backends_lua_helper_tests.exe $b | Select-Object -First 1; $ErrorActionPreference = 'Continue'; & $lua.FullName --gtest_filter=LuaHelper.* 2>&1 | ForEach-Object { "$_" } | Select-String -Pattern 'RUN|OK|FAILED|error|Which is|Expected|logged|^[0-9]:|true,|You try|Cannot|PASSED'; $exe = Get-ChildItem -Recurse -Filter hikari_ui_automation_dialog_tests.exe $b | Select-Object -First 1; foreach ($f in '', 'cancelledRunWithdrawsTheDialog', 'captureProbeDialogCasesAnswer') { $out = "$env:TEMP/automation-dialog-$f.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "$f -o $out,txt" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$env:TEMP/automation-dialog-err.txt"; $null = $p.Handle; if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output "== dialog tests [$f] TIMED OUT" } else { Write-Output "== dialog tests [$f] exit $($p.ExitCode)" }; if (Test-Path $out) { Get-Content $out | Select-String -Pattern 'FAIL|Loc:|Actual|Expected|PASS|SKIP|Totals|QDEBUG|QFATAL|QCRITICAL' }; Get-Content "$env:TEMP/automation-dialog-err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 20 }
    timeoutSeconds: 900
  shell-all:
    # The whole shell suite with QtTest's output in a file (ctest keeps none on Windows); prints the failures.
    script: $env:QT_QPA_PLATFORM = 'offscreen'; $env:PATH = "$PWD/out/sdk/qt-6.11.2-windows/6.11.2/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_shell_tests.exe out/build/windows-x64-release | Select-Object -First 1; $out = "$env:TEMP/shell-all.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "-o $out,txt" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru; if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Output "TIMED OUT" } else { Write-Output "exit $($p.ExitCode)" }; if (Test-Path $out) { Get-Content $out | Select-String -Pattern 'FAIL!|Loc:|Actual|Expected|Totals' -Context 0,0 }
    timeoutSeconds: 900
  backends:
    # Backend adapter tests by name (a label filter on top of the preset's matched nothing).
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(LibassRenderer|WinPortTest|Reopen)[.]"
    timeoutSeconds: 600
  media:
    # The media helper tests with failure output (N1, N2).
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(Fixture|AudioFixture)[.]" --repeat until-fail:3
    timeoutSeconds: 900
  audio:
    # The editor output (N6), verbose so the enumerated devices are recorded.
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(AudioRing|OutputEngine|PortAudioOutput|PortAudioDevice)[.]" -V
    timeoutSeconds: 600
  audio-wasapi:
    # N6 on the VM's HDA endpoint through WASAPI (the default device is DirectSound's); only silence is written.
    script: $env:HIKARI_TEST_AUDIO_DEVICE = 'Windows WASAPI'; ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^PortAudio(Output|Device)[.]" -V
    timeoutSeconds: 600
  audio-hotplug:
    # N6 with real device loss: tools/winix/hotplug.sh starts this and unplugs/replugs a QEMU USB audio device through winix vm device
    # (silent audiodev; Windows names it "Speakers (Audio Device)", "(2- Audio Device)" after a replug) when the test asks. Only silence is written.
    script: $env:HIKARI_TEST_AUDIO_HOTPLUG = '\((\d+- )?Audio Device\)'; $env:HIKARI_TEST_AUDIO_HOTPLUG_API = 'Windows WASAPI'; ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^PortAudioHotplug[.]" -V
    timeoutSeconds: 600
  audio-hotplug-directsound:
    # The same through DirectSound (tools/winix/hotplug.sh hikariusbaudio audio-hotplug-directsound),
    # where the loss shows only as stalled callbacks.
    script: $env:HIKARI_TEST_AUDIO_HOTPLUG = '\((\d+- )?Audio Device\)'; $env:HIKARI_TEST_AUDIO_HOTPLUG_API = 'Windows DirectSound'; $env:HIKARI_TEST_AUDIO_HOTPLUG_STALL_ONLY = '1'; ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^PortAudioHotplug[.]" -V
    timeoutSeconds: 600
  inputs:
    # B4: changed pinned inputs are refused by vcpkg's hash check.
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^changed-input-" -V
    timeoutSeconds: 900
  player:
    # General playback (N5), verbose so the seek observations are recorded.
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "general_player" -V
    timeoutSeconds: 600
  presenter-window:
    # N7 in a real window (the windows platform and its RHI backend), not offscreen.
    script: $env:QT_QPA_PLATFORM = 'windows'; $env:QSG_INFO = '1'; $env:PATH = "$PWD/out/sdk/qt-6.11.2-windows/6.11.2/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_presenter_tests.exe out/build/windows-x64-release | Select-Object -First 1; Write-Output "running $($exe.FullName)"; & $exe.FullName -o presenter-window.txt,txt; $code = $LASTEXITCODE; Get-Content presenter-window.txt; exit $code
    timeoutSeconds: 300
  video-window:
    # I1's Spix workflow in a real window (the windows platform and its RHI backend).
    script: $env:QT_QPA_PLATFORM = 'windows'; $env:PATH = "$PWD/out/sdk/qt-6.11.2-windows/6.11.2/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_video_workflow.exe out/build/windows-x64-release | Select-Object -First 1; Write-Output "running $($exe.FullName)"; $ErrorActionPreference = 'Continue'; & $exe.FullName 2>&1 | ForEach-Object { "$_" }; exit $LASTEXITCODE
    timeoutSeconds: 300
  fonts:
    # Font identity (N4) through DirectWrite, verbose for the provider line.
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(FontIdentity|DirectWriteIdentity|FontCollection)[.]" -V
    timeoutSeconds: 600
  packaging:
    # Helper package manifests (I6), verbose so the closure is recorded.
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -L packaging -V
    timeoutSeconds: 300
  imports:
    # The media helper's direct imports (manifest development aid).
    script: ./tools/winix/msvc.ps1 dumpbin /dependents out/build/windows-x64-release/hikari-media-helper.exe
    timeoutSeconds: 120
  audition:
    # PCM streams and Line audition (I3).
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(PcmFixture|Audition)[.]" -V
    timeoutSeconds: 600
  transport:
    # General <-> indexed handoff (I4), verbose for the frame observations.
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "transport_tests" -V
    timeoutSeconds: 600
  automation:
    # The Lua helper, dialogs and the automation manager (N8, L1), verbose for
    # the per-script process cost.
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(LuaHelper|Manager|AutomationRegistry)[.]|automation" -V
    timeoutSeconds: 600
    # The rewrite side of the S3 legacy comparison (compare_automation.py).
    artifacts: [out/build/windows-x64-release/tests/backends/artifacts/automation-capture-corpus.json, out/build/windows-x64-release/tests/backends/artifacts/automation-capture-corpus-macro.json, out/build/windows-x64-release/tests/ui/artifacts/automation-capture-dialogs.json]
  legacy-win-setup:
    # S3 on Windows: the legacy release (v0.0.1-rc.1, built from the baseline)
    # downloaded, checked and extracted into out/legacy-win for
    # tools/legacy-capture/drive_windows.py; nothing is installed.
    script: ./tools/legacy-capture/windows/setup.ps1
    timeoutSeconds: 900
  legacy-win-output:
    # The probe's capture lines and the legacy Config it left (drive_windows.py).
    script: ./tools/legacy-capture/windows/output.ps1
    timeoutSeconds: 120
  legacy-win-kill:
    # Ends a legacy app the desktop could not close.
    script: Get-Process HikariSub -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Output 'stopped'
    timeoutSeconds: 120
  legacy-win-stacks:
    # The legacy app's thread stacks when it stops responding (a non-invasive
    # attach of the Windows SDK's cdb, if the VM has it; the release ships its PDBs).
    script: $p = Get-Process HikariSub -ErrorAction SilentlyContinue | Select-Object -First 1; if (-not $p) { Write-Output 'no HikariSub process'; exit 0 }; Write-Output "pid $($p.Id) responding=$($p.Responding)"; $p.Threads | ForEach-Object { Write-Output "thread $($_.Id) $($_.ThreadState) $($_.WaitReason)" }; $cdb = @("${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe", "${env:ProgramFiles}\Windows Kits\10\Debuggers\x64\cdb.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1; if (-not $cdb) { Write-Output 'cdb not found'; exit 0 }; $sym = Split-Path $p.Path; & $cdb -pv -p $p.Id -y $sym -c '.symopt+0x40; ~*kc 30; q' 2>&1 | ForEach-Object { "$_" }
    timeoutSeconds: 300
  legacy-win-dump:
    # A minidump of the legacy app (thread stacks, no full memory) through
    # dbghelp's MiniDumpWriteDump, kept as an artifact for offline stacks.
    script: $p = Get-Process HikariSub -ErrorAction SilentlyContinue | Select-Object -First 1; if (-not $p) { Write-Output 'no HikariSub process'; exit 1 }; Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class Dump { [DllImport("dbghelp.dll", SetLastError=true)] public static extern bool MiniDumpWriteDump(IntPtr hProcess, uint pid, Microsoft.Win32.SafeHandles.SafeFileHandle hFile, uint type, IntPtr e, IntPtr u, IntPtr c); }'; New-Item -ItemType Directory -Force out/legacy-win/dump | Out-Null; $f = [IO.File]::Create("$PWD/out/legacy-win/dump/HikariSub.dmp"); $ok = [Dump]::MiniDumpWriteDump($p.Handle, [uint32]$p.Id, $f.SafeFileHandle, 0x0, [IntPtr]::Zero, [IntPtr]::Zero, [IntPtr]::Zero); $f.Close(); Write-Output "pid $($p.Id) responding=$($p.Responding) dump=$ok size=$((Get-Item out/legacy-win/dump/HikariSub.dmp).Length)"
    timeoutSeconds: 300
    artifacts: [out/legacy-win/dump/HikariSub.dmp]
  # D1 native gate on Windows (tools/native-gate/windows/gate_windows.py).
  # Guest scratch: out/native-gate-win. The driver passes parameters through
  # each task's environment (a derived config); the defaults below run alone.
  gate-win-prepare:
    script: ./tools/native-gate/windows/gate.ps1 -Action prepare
    visualStudio: false
    timeoutSeconds: 300
  gate-win-fresh:
    # Sets the HikariSub profile aside (never deleted); `ui launch --fresh-profile` does not reach Qt's known folders.
    script: ./tools/native-gate/windows/gate.ps1 -Action fresh
    visualStudio: false
    timeoutSeconds: 120
  gate-win-restore:
    # Puts a set-aside profile back (GATE_PROFILE_FROM: an out/native-gate-win/old-profiles/<stamp> directory).
    script: ./tools/native-gate/windows/gate.ps1 -Action restore
    visualStudio: false
    timeoutSeconds: 120
  gate-win-status:
    script: ./tools/native-gate/windows/gate.ps1 -Action status
    visualStudio: false
    timeoutSeconds: 120
  gate-win-uia:
    # What winix ui does not report: controls pressed through UIA patterns only, GetDpiForWindow.
    script: ./tools/native-gate/windows/uia.ps1
    visualStudio: false
    timeoutSeconds: 300
  gate-win-fullscreen:
    script: ./tools/native-gate/windows/gate.ps1 -Action fullscreen
    visualStudio: false
    timeoutSeconds: 120
    environment: {GATE_FULLSCREEN: 'off'}
  gate-win-dpi:
    # The guest's display scale (a guest setting); the dpi step restores 100.
    script: ./tools/native-gate/windows/gate.ps1 -Action dpi
    visualStudio: false
    timeoutSeconds: 120
    environment: {GATE_DPI_PERCENT: '100'}
  gate-win-tests:
    # hikari_ui_shell_tests (D1 functions), docking qualification and workspace layout under the windows platform.
    script: ./tools/native-gate/windows/tests.ps1
    visualStudio: false
    timeoutSeconds: 2400
  nvda-setup:
    # NVDA 2026.2 checked against its published SHA-256, as a portable copy under out/native-gate-win/nvda (nothing installed).
    script: ./tools/native-gate/windows/nvda.ps1 -Action setup
    visualStudio: false
    timeoutSeconds: 1200
  nvda-output:
    # Quits NVDA and prints its speech lines; the whole log is the artifact.
    script: ./tools/native-gate/windows/nvda.ps1 -Action output
    visualStudio: false
    timeoutSeconds: 180
    artifacts: [out/native-gate-win/nvda/nvda-last.log]
  display-layout:
    # Both QXL monitors extended at 1024x768 (vm.displays), the second right of the primary; prints the monitor rectangles.
    script: ./tools/native-gate/windows/display.ps1
    visualStudio: false
    timeoutSeconds: 180
    environment: {GATE_DISPLAY: extend}
  gate-win-display:
    # The gate's display changes (GATE_DISPLAY extend|detach|status, GATE_SCALE2 percent); see display.ps1.
    script: ./tools/native-gate/windows/display.ps1
    visualStudio: false
    timeoutSeconds: 180
    environment: {GATE_DISPLAY: status}
