# Windows build and test in a Winix VM; out/ stays in the VM (git-ignored, so `winix sync` skips it).
# The official Qt installer needs a Qt Account: log in once inside the VM.
version: 1
image: windows-dev
workspace: hikari-qt
resources:
  cpus: 6
  memoryGiB: 12
  diskGiB: 180
# audio: none is QEMU's silent backend behind an ICH9 HDA endpoint.
vm: { audio: none, displays: 2 }
exclude: [.git, .winix, .env, '*.pfx', '*.key', out]
pipeline: [provision, build, test]
tasks:
  provision:
    script: ./tools/winix/msvc.ps1 cmake --workflow --preset provision
    timeoutSeconds: 7200
    artifacts: [out/build/provision/provision-evidence]
  build:
    script: ./tools/winix/msvc.ps1 cmake --workflow --preset windows-x64-release
    timeoutSeconds: 3600
    artifacts: [out/build/windows-x64-release/provision-evidence]
  test:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release --output-junit results.xml
    timeoutSeconds: 2700
    artifacts: [out/build/windows-x64-release/results.xml, out/build/windows-x64-release/Testing/Temporary/LastTest.log]
  qttest:
    # Env: TEST (executable name without .exe), ARGS, TEST_TIMEOUT (s, 300), FORMAT (txt|junitxml|none); ctest keeps no output on Windows.
    script: $env:QT_QPA_PLATFORM = 'offscreen'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter "$env:TEST.exe" out/build/windows-x64-release | Select-Object -First 1; if (-not $exe) { Write-Output "no $env:TEST.exe"; exit 2 }; $limit = if ($env:TEST_TIMEOUT) { [int]$env:TEST_TIMEOUT } else { 300 }; $format = if ($env:FORMAT) { $env:FORMAT } else { 'txt' }; $out = "$env:TEMP/qttest-$env:TEST.$format"; Remove-Item $out -ErrorAction SilentlyContinue; $a = "$env:ARGS $(if ($format -ne 'none') { "-o $out,$format" })".Trim(); $sp = @{ FilePath = $exe.FullName; WorkingDirectory = $exe.DirectoryName; NoNewWindow = $true; PassThru = $true; RedirectStandardError = "$env:TEMP/qttest-err.txt" }; if ($a) { $sp.ArgumentList = $a }; $sw = [Diagnostics.Stopwatch]::StartNew(); $p = Start-Process @sp; $null = $p.Handle; if (-not $p.WaitForExit($limit * 1000)) { $p.Kill(); Write-Output "== $env:TEST TIMED OUT after $limit s"; $code = 1 } else { $code = $p.ExitCode; Write-Output "== $env:TEST exit $code after $([int]$sw.Elapsed.TotalSeconds) s" }; if (Test-Path $out) { Get-Content $out }; Write-Output '== stderr'; Get-Content "$env:TEMP/qttest-err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 40; exit $code
    timeoutSeconds: 1200
  shell:
    script: $env:QT_QPA_PLATFORM = 'offscreen'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_shell_tests.exe out/build/windows-x64-release | Select-Object -First 1; foreach ($f in 'selectLinesDialogSelectsAndActs','saveVariantsFollowTheLegacySave','aboutAndCreditsShowTheNotices','resolutionMismatchAndResample','f6AndShortcutsReachAFloatingPanel') { $out = "$env:TEMP/shell-$f.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "$f -o $out,txt" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$env:TEMP/shell-err.txt"; if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Output "== $f TIMED OUT" } else { Write-Output "== $f exit $($p.ExitCode)" }; if (Test-Path $out) { Get-Content $out | Select-String -Pattern 'FAIL|Loc:|Actual|Expected|PASS|SKIP|QWARN|Totals' } }
    timeoutSeconds: 900
  automation-output:
    script: $env:QT_QPA_PLATFORM = 'offscreen'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $b = 'out/build/windows-x64-release'; $lua = Get-ChildItem -Recurse -Filter hikari_backends_lua_helper_tests.exe $b | Select-Object -First 1; $ErrorActionPreference = 'Continue'; & $lua.FullName --gtest_filter=LuaHelper.* 2>&1 | ForEach-Object { "$_" } | Select-String -Pattern 'RUN|OK|FAILED|error|Which is|Expected|logged|^[0-9]:|true,|You try|Cannot|PASSED'; $exe = Get-ChildItem -Recurse -Filter hikari_ui_automation_dialog_tests.exe $b | Select-Object -First 1; foreach ($f in '', 'cancelledRunWithdrawsTheDialog', 'captureProbeDialogCasesAnswer') { $out = "$env:TEMP/automation-dialog-$f.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "$f -o $out,txt" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$env:TEMP/automation-dialog-err.txt"; $null = $p.Handle; if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output "== dialog tests [$f] TIMED OUT" } else { Write-Output "== dialog tests [$f] exit $($p.ExitCode)" }; if (Test-Path $out) { Get-Content $out | Select-String -Pattern 'FAIL|Loc:|Actual|Expected|PASS|SKIP|Totals|QDEBUG|QFATAL|QCRITICAL' }; Get-Content "$env:TEMP/automation-dialog-err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 20 }
    timeoutSeconds: 900
  shell-all:
    # MUST KILL: these six part seams duplicate tests/ui/CMakeLists.txt and must be kept in step by hand.
    script: $env:QT_QPA_PLATFORM = 'offscreen'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_shell_tests.exe out/build/windows-x64-release | Select-Object -First 1; foreach ($part in 'documents=..panelsFloatDockHideAndKeepTheirState', 'panels=panelsFloatDockHideAndKeepTheirState..translationModeStacksOriginalAboveTranslated', 'translation=translationModeStacksOriginalAboveTranslated..hotkeysPageMapsAndOkInstalls', 'hotkeys=hotkeysPageMapsAndOkInstalls..visualToolRailCrosshairAndCopyCoordinates', 'visual=visualToolRailCrosshairAndCopyCoordinates..videoRecentListsAndDialogFolders', 'video=videoRecentListsAndDialogFolders..') { $name, $spec = $part -split '=', 2; $out = "$env:TEMP/shell-all-$name.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "-part $spec -o $out,txt" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru; if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Output "== $name TIMED OUT" } else { Write-Output "== $name exit $($p.ExitCode)" }; if (Test-Path $out) { Get-Content $out | Select-String -Pattern 'FAIL!|Loc:|Actual|Expected|Totals' -Context 0,0 } }
    timeoutSeconds: 1800
  backends:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(LibassRenderer|WinPortTest|Reopen)[.]"
    timeoutSeconds: 600
  media:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(Fixture|AudioFixture)[.]" --repeat until-fail:3
    timeoutSeconds: 900
  audio:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(AudioRing|OutputEngine|PortAudioOutput|PortAudioDevice)[.]" -V
    timeoutSeconds: 600
  audio-wasapi:
    # PortAudio's default device on Windows is DirectSound's, so WASAPI is named.
    script: $env:HIKARI_TEST_AUDIO_DEVICE = 'Windows WASAPI'; ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^PortAudio(Output|Device)[.]" -V
    timeoutSeconds: 600
  audio-slowed:
    script: $env:HIKARI_TEST_AUDIO_DEVICE = 'High Definition Audio Device'; ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^BoxPlayer[.]Slowed" -V
    timeoutSeconds: 600
  audio-hotplug:
    # Started by tools/winix/hotplug.sh; Windows renames the USB device "(2- Audio Device)" after a replug.
    script: $env:HIKARI_TEST_AUDIO_HOTPLUG = '\((\d+- )?Audio Device\)'; $env:HIKARI_TEST_AUDIO_HOTPLUG_API = 'Windows WASAPI'; ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^PortAudioHotplug[.]" -V
    timeoutSeconds: 600
  audio-hotplug-directsound:
    # DirectSound shows the device loss only as stalled callbacks.
    script: $env:HIKARI_TEST_AUDIO_HOTPLUG = '\((\d+- )?Audio Device\)'; $env:HIKARI_TEST_AUDIO_HOTPLUG_API = 'Windows DirectSound'; $env:HIKARI_TEST_AUDIO_HOTPLUG_STALL_ONLY = '1'; ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^PortAudioHotplug[.]" -V
    timeoutSeconds: 600
  inputs:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^changed-input-" -V
    timeoutSeconds: 900
  player:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "general_player" -V
    timeoutSeconds: 600
  presenter-window:
    script: $env:QT_QPA_PLATFORM = 'windows'; $env:QSG_INFO = '1'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_presenter_tests.exe out/build/windows-x64-release | Select-Object -First 1; Write-Output "running $($exe.FullName)"; & $exe.FullName -o presenter-window.txt,txt; $code = $LASTEXITCODE; Get-Content presenter-window.txt; exit $code
    timeoutSeconds: 300
  video-window:
    script: $env:QT_QPA_PLATFORM = 'windows'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_video_workflow.exe out/build/windows-x64-release | Select-Object -First 1; Write-Output "running $($exe.FullName)"; $ErrorActionPreference = 'Continue'; & $exe.FullName 2>&1 | ForEach-Object { "$_" }; exit $LASTEXITCODE
    timeoutSeconds: 300
  video-fullscreen-window:
    # Env: MONITORS (default 2); run display-layout first.
    script: $env:QT_QPA_PLATFORM = 'windows'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_video_fullscreen_workflow.exe out/build/windows-x64-release | Select-Object -First 1; $m = if ($env:MONITORS) { $env:MONITORS } else { '2' }; Write-Output "running $($exe.FullName) --monitors $m"; $ErrorActionPreference = 'Continue'; & $exe.FullName --monitors $m 2>&1 | ForEach-Object { "$_" }; exit $LASTEXITCODE
    visualStudio: false
    timeoutSeconds: 300
  show-in-folder-explorer:
    script: $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_backends_show_in_folder_tests.exe out/build/windows-x64-release | Select-Object -First 1; if (-not $exe) { Write-Output 'no hikari_backends_show_in_folder_tests.exe'; exit 2 }; $dir = "$PWD/out/build/windows-x64-release/p9-explorer"; Remove-Item -Recurse $dir -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $dir | Out-Null; $env:HIKARI_SHOW_IN_FOLDER_EXPLORER = '1'; $env:HIKARI_SHOW_IN_FOLDER_SHOT = "$dir/explorer-selection.png"; $out = "$dir/explorerShowsTheFileSelected.txt"; $p = Start-Process -FilePath $exe.FullName -ArgumentList "explorerShowsTheFileSelected -o `"$out,txt`"" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$dir/stderr.txt"; $null = $p.Handle; if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Output 'TIMED OUT'; exit 1 }; $code = $p.ExitCode; Write-Output "exit $code"; if (-not (Test-Path $out)) { Write-Output 'no QtTest output'; Get-Content "$dir/stderr.txt" -ErrorAction SilentlyContinue; exit 1 }; Get-Content $out; if (Select-String -Quiet -Pattern '^SKIP' $out) { Write-Output 'skipped, so not on an interactive desktop'; exit 1 }; if ($code -eq 0 -and -not (Test-Path $env:HIKARI_SHOW_IN_FOLDER_SHOT)) { Write-Output 'no screenshot'; exit 1 }; exit $code
    visualStudio: false
    timeoutSeconds: 300
    artifacts: [out/build/windows-x64-release/p9-explorer]
  fonts:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(FontIdentity|DirectWriteIdentity|FontCollection|FontCollectorRenderer|FontFixtureFiles)[.]" -V
    timeoutSeconds: 600
  font-cleanup:
    script: ./tools/winix/font-cleanup.ps1
    timeoutSeconds: 600
  packaging:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -L packaging -V
    timeoutSeconds: 300
  imports:
    script: ./tools/winix/msvc.ps1 dumpbin /dependents out/build/windows-x64-release/hikari-media-helper.exe
    timeoutSeconds: 120
  audition:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(PcmFixture|Audition)[.]" -V
    timeoutSeconds: 600
  transport:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "transport_tests" -V
    timeoutSeconds: 600
  automation:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^(LuaHelper|Manager|AutomationRegistry)[.]|automation" -V
    timeoutSeconds: 600
    artifacts: [out/build/windows-x64-release/tests/backends/artifacts/automation-capture-corpus.json, out/build/windows-x64-release/tests/backends/artifacts/automation-capture-corpus-macro.json, out/build/windows-x64-release/tests/ui/artifacts/automation-capture-dialogs.json]
  end-setups:
    script: ./tools/winix/end-setups.ps1
    visualStudio: false
    timeoutSeconds: 120
  # gate-win-*: tools/native-gate/windows/gate_windows.py passes their parameters through the environment.
  gate-win-prepare:
    script: ./tools/native-gate/windows/gate.ps1 -Action prepare
    visualStudio: false
    timeoutSeconds: 300
  gate-win-fresh:
    # Sets the profile aside (never deleted): winix `ui launch --fresh-profile` does not reach Qt's known folders.
    script: ./tools/native-gate/windows/gate.ps1 -Action fresh
    visualStudio: false
    timeoutSeconds: 120
  gate-win-restore:
    # Env: GATE_PROFILE_FROM, an out/native-gate-win/old-profiles/<stamp> directory.
    script: ./tools/native-gate/windows/gate.ps1 -Action restore
    visualStudio: false
    timeoutSeconds: 120
  gate-win-status:
    script: ./tools/native-gate/windows/gate.ps1 -Action status
    visualStudio: false
    timeoutSeconds: 120
  gate-win-uia:
    # What winix ui does not report: controls pressed through UIA patterns only, GetDpiForWindow.
    script: ./tools/native-gate/windows/uia.ps1
    visualStudio: false
    timeoutSeconds: 300
  gate-win-fullscreen:
    script: ./tools/native-gate/windows/gate.ps1 -Action fullscreen
    visualStudio: false
    timeoutSeconds: 120
    environment: {GATE_FULLSCREEN: 'off'}
  gate-win-dpi:
    script: ./tools/native-gate/windows/gate.ps1 -Action dpi
    visualStudio: false
    timeoutSeconds: 120
    environment: {GATE_DPI_PERCENT: '100'}
  gate-win-theme:
    script: ./tools/native-gate/windows/gate.ps1 -Action theme
    visualStudio: false
    timeoutSeconds: 120
    environment: {GATE_THEME: dark, GATE_FOLLOW: 'false'}
  gate-win-system-theme:
    # GATE_APPS_LIGHT: 1|0|status.
    script: ./tools/native-gate/windows/gate.ps1 -Action systemtheme
    visualStudio: false
    timeoutSeconds: 120
    environment: {GATE_APPS_LIGHT: status}
  title-bar-window:
    script: $env:QT_QPA_PLATFORM = 'windows'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_title_bar_tests.exe out/build/windows-x64-release | Select-Object -First 1; if (-not $exe) { Write-Output 'no hikari_ui_title_bar_tests.exe'; exit 2 }; $out = "$env:TEMP/title-bar-window.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "-o `"$out,txt`"" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$env:TEMP/title-bar-err.txt"; $null = $p.Handle; if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Output 'TIMED OUT'; exit 1 }; $code = $p.ExitCode; Write-Output "exit $code"; if (-not (Test-Path $out)) { Write-Output 'no QtTest output'; Get-Content "$env:TEMP/title-bar-err.txt" -ErrorAction SilentlyContinue; exit 1 }; Get-Content $out; if (Select-String -Quiet -Pattern '^SKIP.*windowsTitleBarFollowsTheTheme' $out) { Write-Output 'skipped, so not on an interactive desktop'; exit 1 }; exit $code
    visualStudio: false
    timeoutSeconds: 300
  k1-sheets-window:
    script: $env:QT_QPA_PLATFORM = 'windows'; $dir = "$PWD/out/build/windows-x64-release/k1-sheets-window"; Remove-Item -Recurse $dir -ErrorAction SilentlyContinue; $env:HIKARI_ICON_SHEET_DIR = $dir; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_icon_tests.exe out/build/windows-x64-release | Select-Object -First 1; if (-not $exe) { Write-Output 'no hikari_ui_icon_tests.exe'; exit 2 }; $out = "$env:TEMP/k1-sheets-window.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "contactSheetsFitTheScreen contactSheets -o `"$out,txt`"" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$env:TEMP/k1-sheets-err.txt"; $null = $p.Handle; if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output 'TIMED OUT'; exit 1 }; $code = $p.ExitCode; Write-Output "exit $code"; if (-not (Test-Path $out)) { Write-Output 'no QtTest output'; Get-Content "$env:TEMP/k1-sheets-err.txt" -ErrorAction SilentlyContinue; exit 1 }; Get-Content $out; Get-ChildItem $dir -Filter *.png -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "sheet $($_.Name)" }; exit $code
    visualStudio: false
    timeoutSeconds: 600
    artifacts: [out/build/windows-x64-release/k1-sheets-window]
  gate-win-tests:
    script: ./tools/native-gate/windows/tests.ps1
    visualStudio: false
    timeoutSeconds: 2400
  nvda-setup:
    script: ./tools/native-gate/windows/nvda.ps1 -Action setup
    visualStudio: false
    timeoutSeconds: 1200
  nvda-output:
    script: ./tools/native-gate/windows/nvda.ps1 -Action output
    visualStudio: false
    timeoutSeconds: 180
    artifacts: [out/native-gate-win/nvda/nvda-last.log]
  display-layout:
    script: ./tools/native-gate/windows/display.ps1
    visualStudio: false
    timeoutSeconds: 180
    environment: {GATE_DISPLAY: extend}
  gate-win-display:
    # GATE_DISPLAY: extend|detach|status; GATE_SCALE2: percent.
    script: ./tools/native-gate/windows/display.ps1
    visualStudio: false
    timeoutSeconds: 180
    environment: {GATE_DISPLAY: status}
  vsfiltermod-build:
    script: ./tools/winix/msvc.ps1 cmake --preset windows-x64-vsfiltermod; if ($LASTEXITCODE) { exit $LASTEXITCODE }; ./tools/winix/msvc.ps1 cmake --build --preset windows-x64-vsfiltermod --target hikarisub hikari_backends_csri_tests hikari_backends_vsfiltermod_tests hikari_ui_shell_tests hikari_application_options_dialog_tests
    timeoutSeconds: 7200
    artifacts: [out/build/windows-x64-vsfiltermod/provision-evidence]
  vsfiltermod-test:
    # An unset HIKARI_VSFILTERMOD_CSRI turns the VSFilterMod tests into skips (vsfilter-task-environment checks it).
    script: $env:HIKARI_VSFILTERMOD_CSRI = "$PWD/out/build/windows-x64-vsfiltermod/tests/backends/vsfiltermod-csri"; ./tools/winix/msvc.ps1 ctest --preset windows-x64-vsfiltermod -R "^(Csri|RendererSelection|VsfilterMod|OptionsDialog)[.]" -V
    timeoutSeconds: 1200
    artifacts: [out/build/windows-x64-vsfiltermod/tests/backends/artifacts/vsfiltermod]
  vsfiltermod-shell:
    script: $env:QT_QPA_PLATFORM = 'offscreen'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_shell_tests.exe out/build/windows-x64-vsfiltermod | Select-Object -First 1; Write-Output "csri $((Get-ChildItem "$($exe.DirectoryName)/Csri" | ForEach-Object Name) -join ', ')"; $code = 0; foreach ($f in 'subtitleDisplayFilterSwitchesOnTheLoadedVideo','settingsDialogAppliesChangedValuesLive','settingsDialogPagesBindTheLegacyOptions','aboutAndCreditsShowTheNotices','fontCollectorDoesNotCertifyACsriRenderer') { $out = "$env:TEMP/vsfiltermod-$f.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "$f -o $out,txt" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$env:TEMP/vsfiltermod-err.txt"; $null = $p.Handle; if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Output "== $f TIMED OUT"; $code = 1 } else { Write-Output "== $f exit $($p.ExitCode)"; if ($p.ExitCode) { $code = 1 } }; if (Test-Path $out) { Get-Content $out | Select-String -Pattern 'FAIL|Loc:|Actual|Expected|PASS|SKIP|QWARN|Totals' } }; exit $code
    timeoutSeconds: 1200
    artifacts: [out/build/windows-x64-vsfiltermod/tests/ui/artifacts/vsfiltermod-switch]
  vsfiltermod-shots:
    # Offscreen has no fonts on Windows.
    script: $env:QT_QPA_PLATFORM = 'windows'; $env:HIKARI_SURFACE_SHOT_DIR = "$PWD/out/build/windows-x64-vsfiltermod/w2-shots"; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_shell_tests.exe out/build/windows-x64-vsfiltermod | Select-Object -First 1; $out = "$env:TEMP/vsfiltermod-shots.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "w2SurfaceScreenshots -o $out,txt" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru; $null = $p.Handle; if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Output 'TIMED OUT'; exit 1 }; if (Test-Path $out) { Get-Content $out | Select-String -Pattern 'FAIL|Loc:|PASS|Totals' }; exit $p.ExitCode
    timeoutSeconds: 600
    artifacts: [out/build/windows-x64-vsfiltermod/w2-shots]
  vsfilter-default:
    script: ./tools/winix/msvc.ps1 cmake --preset windows-x64-release; if ($LASTEXITCODE) { exit $LASTEXITCODE }; ./tools/winix/msvc.ps1 cmake --build --preset windows-x64-release --target hikari_backends_csri_tests hikari_ui_shell_tests; if ($LASTEXITCODE) { exit $LASTEXITCODE }; ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "^Csri[.]"; $code = $LASTEXITCODE; $env:QT_QPA_PLATFORM = 'offscreen'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_shell_tests.exe out/build/windows-x64-release | Select-Object -First 1; Write-Output "csri folder $(Test-Path "$($exe.DirectoryName)/Csri")"; foreach ($f in 'subtitleDisplayFilterSwitchesOnTheLoadedVideo','settingsDialogAppliesChangedValuesLive','settingsDialogPagesBindTheLegacyOptions','aboutAndCreditsShowTheNotices') { $out = "$env:TEMP/vsfilter-default-$f.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "$f -o $out,txt" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$env:TEMP/vsfilter-default-err.txt"; $null = $p.Handle; if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Output "== $f TIMED OUT"; $code = 1 } else { Write-Output "== $f exit $($p.ExitCode)"; if ($p.ExitCode) { $code = 1 } }; if (Test-Path $out) { Get-Content $out | Select-String -Pattern 'FAIL|Loc:|Actual|Expected|Totals' } }; exit $code
    timeoutSeconds: 3600
  w1-tests:
    script: ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "directshow|OptionsDialog" --output-on-failure
    timeoutSeconds: 1200
  w1-desktop:
    script: $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $env:QT_QPA_PLATFORM = 'windows'; $env:HIKARI_SCREENSHOT_DIR = 'C:/w1desktop'; $exe = Get-ChildItem -Recurse -Filter hikari_ui_directshow_workflow.exe out/build/windows-x64-release | Select-Object -First 1; $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardOutput "$env:TEMP/w1desktop.txt"; $null = $p.Handle; if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Output 'TIMED OUT' }; Get-Content "$env:TEMP/w1desktop.txt"; exit $p.ExitCode
    timeoutSeconds: 300
  w1-probe:
    # Which encodings stock DirectShow plays.
    script: $b = 'out/build/windows-x64-release'; $f = (Get-ChildItem -Recurse -Filter hikari_media_fixture.exe $b | Select-Object -First 1).FullName; $p = (Get-ChildItem -Recurse -Filter hikari_directshow_probe.exe $b | Select-Object -First 1).FullName; $d = "$env:TEMP/w1probe"; New-Item -ItemType Directory -Force $d | Out-Null; $ErrorActionPreference = 'Continue'; foreach ($k in 'dshow-cfr.avi', 'dshow-vfr.wmv', 'probe-avi-xvid.avi', 'probe-avi-fmp4.avi', 'probe-avi-m4s2.avi', 'probe-avi-mp4s.avi', 'probe-avi-div3.avi', 'probe-avi-mp43.avi', 'probe-avi-mjpeg.avi', 'probe-asf-wmv2.wmv', 'probe-asf-wmv2-vfr.wmv', 'probe-mpeg-mpeg1.mpg') { $n = $k.Substring(0, $k.LastIndexOf('.')); & $f "$d/$k" $n 2>&1 | Out-Null; Write-Output "== $k"; & $p --graph "$d/$k" 2>&1 | ForEach-Object { "$_" }; & $p "$d/$k" 1000 1500 200 1035 0 2>&1 | ForEach-Object { "$_" }; Write-Output "exit $LASTEXITCODE" }; exit 0
    timeoutSeconds: 600
  v4-clipboard-window:
    script: $env:QT_QPA_PLATFORM = 'windows'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_shell_tests.exe out/build/windows-x64-release | Select-Object -First 1; if (-not $exe) { Write-Output 'no hikari_ui_shell_tests.exe'; exit 2 }; $f = 'videoSnapshotsReachTheSystemClipboard'; $out = "$env:TEMP/v4-clipboard.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "$f -o `"$out,txt`"" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$env:TEMP/v4-clipboard-err.txt"; $null = $p.Handle; if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output 'TIMED OUT'; exit 1 }; $code = $p.ExitCode; Write-Output "exit $code"; if (-not (Test-Path $out)) { Write-Output 'no QtTest output'; Get-Content "$env:TEMP/v4-clipboard-err.txt" -ErrorAction SilentlyContinue; exit 1 }; Get-Content $out; if (Select-String -Quiet -Pattern "^SKIP.*$f" $out) { Write-Output 'skipped, so the system clipboard was not reached'; exit 1 }; exit $code
    visualStudio: false
    timeoutSeconds: 600
  y7-dropper-desktop:
    script: $env:QT_QPA_PLATFORM = 'windows'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $b = 'out/build/windows-x64-release'; $code = 0; foreach ($run in @(@('hikari_ui_colour_picker_tests', 'theRouteOfThisSession theScreenRouteReadsThePixelsAroundThePoint trackingReportsThePointer moveToPointerFollowsLegacy'), @('hikari_ui_shell_tests', 'screenDroppersReadTheScreenItself'))) { $exe = Get-ChildItem -Recurse -Filter "$($run[0]).exe" $b | Select-Object -First 1; if (-not $exe) { Write-Output "no $($run[0]).exe"; exit 2 }; $out = "$env:TEMP/y7-$($run[0]).txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "$($run[1]) -o `"$out,txt`"" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$env:TEMP/y7-err.txt"; $null = $p.Handle; if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output "== $($run[0]) TIMED OUT"; $code = 1; continue }; Write-Output "== $($run[0]) exit $($p.ExitCode)"; if ($p.ExitCode) { $code = 1 }; if (-not (Test-Path $out)) { Write-Output 'no QtTest output'; Get-Content "$env:TEMP/y7-err.txt" -ErrorAction SilentlyContinue; $code = 1; continue }; Get-Content $out; if (Select-String -Quiet -Pattern '^SKIP' $out) { Write-Output 'skipped, so no screen pixels were read'; $code = 1 } }; exit $code
    visualStudio: false
    timeoutSeconds: 900
  w2-switch-desktop:
    # Run vsfiltermod-build first.
    script: $env:QT_QPA_PLATFORM = 'windows'; $dir = "$PWD/out/build/windows-x64-vsfiltermod/w2-desktop"; Remove-Item -Recurse $dir -ErrorAction SilentlyContinue; $env:HIKARI_SURFACE_SHOT_DIR = $dir; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter hikari_ui_shell_tests.exe out/build/windows-x64-vsfiltermod | Select-Object -First 1; if (-not $exe) { Write-Output 'no hikari_ui_shell_tests.exe in the vsfiltermod build'; exit 2 }; Write-Output "csri $((Get-ChildItem "$($exe.DirectoryName)/Csri" | ForEach-Object Name) -join ', ')"; $f = 'subtitleDisplayFilterSwitchesOnTheLoadedVideo'; $out = "$env:TEMP/w2-switch.txt"; Remove-Item $out -ErrorAction SilentlyContinue; $p = Start-Process -FilePath $exe.FullName -ArgumentList "$f -o `"$out,txt`"" -WorkingDirectory $exe.DirectoryName -NoNewWindow -PassThru -RedirectStandardError "$env:TEMP/w2-switch-err.txt"; $null = $p.Handle; if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output 'TIMED OUT'; exit 1 }; $code = $p.ExitCode; Write-Output "exit $code"; if (-not (Test-Path $out)) { Write-Output 'no QtTest output'; Get-Content "$env:TEMP/w2-switch-err.txt" -ErrorAction SilentlyContinue; exit 1 }; Get-Content $out; if (Select-String -Quiet -Pattern "^SKIP.*$f" $out) { Write-Output 'skipped'; exit 1 }; foreach ($n in 'libass', 'vsfiltermod', 'libass-again') { if (-not (Test-Path "$dir/w2-desktop-$n.png")) { Write-Output "no w2-desktop-$n.png"; $code = 1 } }; exit $code
    visualStudio: false
    timeoutSeconds: 600
    artifacts: [out/build/windows-x64-vsfiltermod/w2-desktop]
  qttest-window:
    # Env: TEST, ARGS, TEST_TIMEOUT, FORMAT, OUT, REQUIRE_RUN=1 (a skip fails); any other --env reaches the test.
    script: $env:QT_QPA_PLATFORM = 'windows'; ./tools/winix/qttest.ps1
    visualStudio: false
    timeoutSeconds: 1800
  ctest-regex:
    # Env: R (ctest regex), V=1 for -V.
    script: $v = if ($env:V) { '-V' } else { '--output-on-failure' }; ./tools/winix/msvc.ps1 ctest --preset windows-x64-release -R "$env:R" $v --output-junit results-regex.xml
    timeoutSeconds: 2700
    artifacts: [out/build/windows-x64-release/results-regex.xml]
  review-window:
    script: ./tools/winix/review-window.ps1
    visualStudio: false
    timeoutSeconds: 3600
    artifacts: [out/build/windows-x64-release/review-window]
  vsfiltermod-shell-all:
    # Run vsfiltermod-build first.
    script: $env:BUILD = 'windows-x64-vsfiltermod'; $env:TEST = 'hikari_ui_shell_tests'; $env:TEST_TIMEOUT = '2400'; $env:OUT = 'out/build/windows-x64-vsfiltermod/shell-all'; ./tools/winix/qttest.ps1
    visualStudio: false
    timeoutSeconds: 2700
    artifacts: [out/build/windows-x64-vsfiltermod/shell-all]
  workflow-window:
    # Env: TEST (workflow executable name), ARGS.
    script: $env:QT_QPA_PLATFORM = 'windows'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $exe = Get-ChildItem -Recurse -Filter "$env:TEST.exe" out/build/windows-x64-release | Select-Object -First 1; if (-not $exe) { Write-Output "no $env:TEST.exe"; exit 2 }; Write-Output "running $($exe.FullName) $env:ARGS"; $ErrorActionPreference = 'Continue'; $a = if ($env:ARGS) { $env:ARGS -split ' ' } else { @() }; & $exe.FullName @a 2>&1 | ForEach-Object { "$_" }; Write-Output "exit $LASTEXITCODE"; exit $LASTEXITCODE
    visualStudio: false
    timeoutSeconds: 600
  cmd:
    # Env: CMD, one PowerShell command line.
    script: $ErrorActionPreference = 'Continue'; Invoke-Expression $env:CMD
    visualStudio: false
    timeoutSeconds: 300
  audio-removal:
    # Unplug hikariusbaudio on HOTPLUG-READY (tools/audio-removal/sinks.ps1); out/audio-removal/tone.mkv is pushed first.
    script: $env:QT_QPA_PLATFORM = 'offscreen'; $env:PATH = "$PWD/out/sdk/qt-6.12.0-windows/6.12.0/msvc2022_64/bin;$env:PATH"; $env:HIKARI_AUDIO_REMOVAL = "$PWD/tools/audio-removal/sinks.cmd"; $env:AUDIO_REMOVAL_MEDIA = "$PWD/out/audio-removal/tone.mkv"; $exe = Get-ChildItem -Recurse -Filter hikari_backends_general_player_tests.exe out/build/windows-x64-release | Select-Object -First 1; $ErrorActionPreference = 'Continue'; & $exe.FullName "playbackFollowsTheRouteWhenItsDeviceGoesAway:picked device" 2>&1 | ForEach-Object { "$_" }; exit $LASTEXITCODE
    timeoutSeconds: 300
