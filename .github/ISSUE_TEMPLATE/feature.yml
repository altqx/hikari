# CR1 (#452): filled by HikariSub's Help › Report an issue (Feature request);
# keep the ids in step with src/app/crash_reports.cpp.
name: Feature request
description: Something HikariSub could do.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: wanted
    attributes:
      label: What you'd like
      description: Describe the feature.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it would help with
      description: What are you trying to do?
  - type: textarea
    id: system
    attributes:
      label: System and settings
      description: Filled in by HikariSub (version, package, system, settings as ids).
      render: text
