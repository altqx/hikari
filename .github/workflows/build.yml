name: Build

on:
  # Only master on push. Branches in this repository with an open pull request
  # would otherwise be built twice for one commit, once per event.  A v* tag
  # builds and publishes a release.
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  # head_ref on a pull_request, ref otherwise, so a branch and its PR share one
  # group and the older run is cancelled rather than running alongside.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # DependencyControl's DownloadManager module links libcurl.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcurl4-openssl-dev

      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-tests -j"$(nproc)"

      - name: Run
        run: ctest --test-dir build-tests --output-on-failure

  # The tests of the save code that is Windows' own, which needs no
  # dependency and builds in a minute.
  windows-tests:
    name: Windows tests
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tests -B build-tests -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build-tests --config Release

      - name: Run
        run: ctest --test-dir build-tests -C Release --output-on-failure

  windows:
    name: Windows (${{ matrix.configuration }}|x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Install NASM
        run: choco install nasm --no-progress -y
      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # The VirtualDub libraries assemble their SIMD kernels with YASM, through
      # the vsyasm integration the xy-VSFilter fork carries as
      # src/YASM.{props,targets,xml} -- that one calls yasm from PATH.  The
      # chocolatey package provides the assembler itself: yasm publishes its
      # Windows build as yasm-1.2.0-win64.exe, not as an installer.
      # msgfmt compiles Locale/*.po into the .mo files HikariSub loads at run time;
      # the pre-build event skips that when msgfmt is missing.  Non-fatal, so a
      # package hiccup costs the artifact its translations, not the build.
      - name: Install gettext
        continue-on-error: true
        run: |
          choco install gettext --no-progress -y

          # The install lands outside this process's PATH (choco edits only the
          # machine one), so look for msgfmt.exe itself: asking `where` here
          # reports it missing and fails the step even though the install
          # worked and later steps can find it.
          $dir = @(
              "$env:ProgramFiles\gettext-iconv\bin",
              "${env:ProgramFiles(x86)}\gettext-iconv\bin",
              "C:\ProgramData\chocolatey\bin") |
            Where-Object { Test-Path (Join-Path $_ 'msgfmt.exe') } |
            Select-Object -First 1

          if (-not $dir) {
            throw 'msgfmt.exe is not where gettext installs it; the package will ship without compiled catalogs'
          }

          $dir | Out-File -Append $env:GITHUB_PATH
          $env:PATH = "$dir;$env:PATH"
          msgfmt --version

      - name: Install YASM
        run: choco install yasm --no-progress -y

      # D3DXCreateFontW / D3DXCreateLine live in the June 2010 DirectX SDK,
      # which no Windows SDK replaced and no runner image carries.  Its
      # installer fails on modern images (error S1023) because a newer VC++
      # 2010 redistributable is already present, so extract the payload
      # instead: only Include and Lib are needed.  HikariSub.vcxproj reads
      # DXSDK_DIR.
      - name: Cache DirectX SDK
        id: dxsdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/dxsdk
          key: dxsdk-jun2010-headers-libs-v1

      - name: Fetch DirectX SDK (June 2010)
        if: steps.dxsdk-cache.outputs.cache-hit != 'true'
        run: |
          $url = 'https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe'
          Invoke-WebRequest -Uri $url -OutFile dxsdk.exe -UseBasicParsing
          & 7z x dxsdk.exe -oraw -y '*\Include\*' '*\Lib\*' | Out-Null
          $inc = Get-ChildItem raw -Recurse -Directory -Filter Include | Select-Object -First 1
          $lib = Get-ChildItem raw -Recurse -Directory -Filter Lib     | Select-Object -First 1
          if (-not $inc -or -not $lib) { throw 'DirectX SDK payload did not contain Include/Lib' }
          Remove-Item dxsdk -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dxsdk | Out-Null
          Move-Item $inc.FullName dxsdk\Include
          Move-Item $lib.FullName dxsdk\Lib
          Remove-Item raw, dxsdk.exe -Recurse -Force

      - name: Point the build at the DirectX SDK
        run: |
          if (-not (Test-Path "dxsdk\Lib\x64\d3dx9.lib")) { throw 'd3dx9.lib missing from the extracted SDK' }
          echo "DXSDK_DIR=${{ github.workspace }}\dxsdk\" >> $env:GITHUB_ENV

      # hydrate.ps1 pulls ~200 MB of archives whose contents are pinned by
      # SHA-256, so the manifest is a sound cache key.
      - name: Cache hydrated dependencies
        id: hydrate-cache
        uses: actions/cache/restore@v4
        with:
          path: Thirdparty/.cache
          key: hydrate-${{ hashFiles('Thirdparty/dependencies.json') }}

      # Verbatim from the manifest + hydrate.ps1, and with no restore-key prefix:
      # hydrate.ps1 only checks marker files, so a stale tree restored under a
      # shared prefix would be skipped rather than noticed.
      - name: Cache hydrated dependency trees
        id: hydrate-trees-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Thirdparty/boost
            Thirdparty/icu
            Thirdparty/ffmpeg
            Thirdparty/fribidi
            Thirdparty/zlib
            Thirdparty/curl
          key: hydrate-trees-${{ hashFiles('Thirdparty/dependencies.json', 'Thirdparty/hydrate.ps1') }}

      # wxWidgets takes the bulk of the bootstrap time and only changes when
      # the submodule pin moves.
      - name: Resolve the wxWidgets pin
        id: wx-pin
        run: echo "sha=$(git rev-parse HEAD:Thirdparty/wxWidgets)" >> $env:GITHUB_OUTPUT

      - name: Cache wxWidgets libraries
        id: wx-cache
        uses: actions/cache/restore@v4
        with:
          path: Thirdparty/wxWidgets/lib
          key: wx2-${{ matrix.configuration }}-${{ steps.wx-pin.outputs.sha }}-${{ hashFiles('Thirdparty/build-wxwidgets.ps1') }}

      # A cache hit is not proof the libraries are usable: the save step below
      # used to run on failed runs too, so a partial lib/ could be cached and
      # then restored over a build that was skipped because of it. Check for
      # the header the build actually needs.
      - name: Check the restored wxWidgets libraries
        id: wx-check
        run: |
          $setup = "Thirdparty/wxWidgets/lib/vc_x64_lib/mswu/wx/setup.h"
          $usable = Test-Path -LiteralPath $setup
          if (-not $usable -and '${{ steps.wx-cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host "::warning::wxWidgets cache hit but $setup is missing; rebuilding."
          }
          echo "usable=$($usable.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Bootstrap
        run: >
          pwsh -File Thirdparty\bootstrap.ps1
          -Configuration ${{ matrix.configuration }}
          ${{ steps.wx-check.outputs.usable == 'true' && '-SkipWxWidgets' || '' }}

      - name: Build
        timeout-minutes: 90
        run: msbuild HikariSub.sln /m /v:minimal /p:Configuration=${{ matrix.configuration }} /p:Platform=x64

      # The package ships both executables.  The AVX configuration is built here
      # rather than as a solution configuration: MSBuild's mapping of Rel_AVX512
      # gives some dependencies a static runtime (Kasumi.lib), which the dynamic
      # one this application uses cannot link against (LNK2038/LNK1319).  Built
      # with the project references already produced above, the AVX executable
      # links against the Release libraries, whose runtime matches.
      - name: Build the AVX configuration
        if: matrix.configuration == 'Release'
        timeout-minutes: 60
        run: msbuild HikariSub.sln /m /v:minimal /t:HikariSub /p:Configuration=Rel_AVX512 /p:Platform=x64 /p:BuildProjectReferences=false


      # actions/cache only saves when the job succeeds (post-if: success()), and
      # every Windows job here has failed at least once on the way to a green
      # build, so nothing was ever cached.  Restore above, save here with
      # if: always(), which is what makes a failing run still worth something.
      - name: Save DirectX SDK
        if: always() && steps.dxsdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/dxsdk
          key: dxsdk-jun2010-headers-libs-v1

      - name: Save hydrated dependencies
        if: always() && steps.hydrate-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Thirdparty/.cache
          key: hydrate-${{ hashFiles('Thirdparty/dependencies.json') }}

      - name: Save hydrated dependency trees
        if: always() && steps.hydrate-trees-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Thirdparty/boost
            Thirdparty/icu
            Thirdparty/ffmpeg
            Thirdparty/fribidi
            Thirdparty/zlib
            Thirdparty/curl
          key: hydrate-trees-${{ hashFiles('Thirdparty/dependencies.json', 'Thirdparty/hydrate.ps1') }}

      - name: Save wxWidgets libraries
        if: success() && steps.wx-check.outputs.usable != 'true'
        uses: actions/cache/save@v4
        with:
          path: Thirdparty/wxWidgets/lib
          key: wx2-${{ matrix.configuration }}-${{ steps.wx-pin.outputs.sha }}-${{ hashFiles('Thirdparty/build-wxwidgets.ps1') }}

      - name: Check the executable exists
        run: |
          $exe = "x64\${{ matrix.configuration }}\HikariSub.exe"
          if (-not (Test-Path $exe)) { throw "not built: $exe" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      # The artifact is the shippable package: binaries plus the runtime data
      # (Automation 4 library, dictionaries, locales, CSRI renderers and the
      # runtimes Windows does not always have) assembled by .github/scripts/package.py
      # from pinned public repositories -- see runtime-assets.json.
      - name: Package the runtime
        if: matrix.configuration == 'Release'
        run: python .github/scripts/package.py --platform windows --build-dir x64/Release --stage "dist/HikariSub_x64" --no-archive

      - name: Upload the package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: hikarisub-windows-x64
          path: dist
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config ninja-build gettext \
            libgtk-3-dev \
            libffms2-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libass-dev libhunspell-dev libuchardet-dev libcurl4-openssl-dev \
            libicu-dev libboost-all-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      # Only the install prefix is consumed (CMakeLists.txt finds wx-config
      # there), so that is all that is cached.
      - name: Resolve the wxWidgets pin
        id: wx-pin
        run: |
          echo "sha=$(git rev-parse HEAD:Thirdparty/wxWidgets)" >> "$GITHUB_OUTPUT"
          echo "prefix=${{ matrix.build_type == 'Debug' && 'build-wx-linux-debug' || 'build-wx-linux' }}/prefix" >> "$GITHUB_OUTPUT"

      - name: Cache wxWidgets
        id: wx-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.wx-pin.outputs.prefix }}
          key: wx-linux-ubuntu-24.04-${{ matrix.build_type }}-${{ steps.wx-pin.outputs.sha }}-${{ hashFiles('Thirdparty/build-wxwidgets-linux.sh') }}

      - name: Check the restored wxWidgets
        id: wx-check
        run: |
          wx_config="${{ steps.wx-pin.outputs.prefix }}/bin/wx-config"
          if [[ -x "$wx_config" ]] && "$wx_config" --version >/dev/null; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            if [[ '${{ steps.wx-cache.outputs.cache-hit }}' == 'true' ]]; then
              echo "::warning::wxWidgets cache hit but $wx_config is unusable; rebuilding."
            fi
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build pinned wxWidgets 3.3.3
        if: steps.wx-check.outputs.usable != 'true'
        run: Thirdparty/build-wxwidgets-linux.sh ${{ matrix.build_type == 'Debug' && '--debug' || '' }}

      # Saved straight after the build so a later failure still keeps it.
      - name: Save wxWidgets
        if: steps.wx-check.outputs.usable != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.wx-pin.outputs.prefix }}
          key: wx-linux-ubuntu-24.04-${{ matrix.build_type }}-${{ steps.wx-pin.outputs.sha }}-${{ hashFiles('Thirdparty/build-wxwidgets-linux.sh') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Validate the desktop integration
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream libxml2-utils
          cmake --install build --prefix "$PWD/stage"
          desktop-file-validate stage/share/applications/io.github.altqx.HikariSub.desktop
          appstreamcli validate --no-net stage/share/metainfo/io.github.altqx.HikariSub.metainfo.xml
          xmllint --noout stage/share/mime/packages/hikarisub.xml
          # Icon= must actually resolve, or the launcher shows a blank tile.
          for size in 16x16 32x32 48x48 64x64 128x128 256x256; do
            test -f "stage/share/icons/hicolor/$size/apps/hikarisub.png"
          done

      - name: Check the executable exists
        run: test -x build/hikarisub && ls -l build/hikarisub

      - name: Package the runtime
        if: matrix.build_type == 'Release'
        run: |
          cmake --build build --target hikarisub_linux_package
          mkdir -p build/package-check
          tar -xzf build/dist/hikarisub-linux-x86_64.tar.gz -C build/package-check
          package=build/package-check/hikarisub-linux-x86_64
          test -x "$package/hikarisub"
          test -f "$package/libwx_gtk3u_core-3.3.so.3"
          test -f "$package/HikariSub/Bitmaps/HideTags.png"
          test -f "$package/Automation/automation/Autoload/strip-tags.lua"
          test -f "$package/Automation/automation/Include/BM/BadMutex/libBadMutex.so"
          test -f "$package/Automation/automation/Include/PT/PreciseTimer/libPreciseTimer.so"
          test -f "$package/Automation/automation/Include/DM/DownloadManager/libDownloadManager.so"
          test -f "$package/Automation/automation/Include/SubInspector/Inspector/libSubInspector.so"
          # Inspector.moon must load the packaged library and measure lines.
          sudo apt-get install -y --no-install-recommends luajit libluajit-5.1-dev pkg-config fonts-dejavu-core
          tests/subinspector/check-package.sh "$package"
          test -f "$package/Themes/DeepDark.txt"
          (cd "$package" && sha256sum -c SHA256SUMS)
          (cd build/dist && sha256sum -c hikarisub-linux-x86_64.tar.gz.sha256)
          spaced_package="build/package-check/hikarisub with spaces"
          mv "$package" "$spaced_package"
          XDG_DATA_HOME="$PWD/build/package-check/desktop data" \
            "$spaced_package/install-desktop-integration.sh"
          desktop="build/package-check/desktop data/applications/io.github.altqx.HikariSub.desktop"
          desktop-file-validate "$desktop"
          grep -Fx "Exec=\"$PWD/$spaced_package/hikarisub\" %f" "$desktop"

      - name: Upload the package
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: hikarisub-linux-x86_64
          path: build/dist/hikarisub-linux-x86_64.tar.gz*
          if-no-files-found: error

  # The release packages for Linux, built in the ubuntu:22.04 floor container
  # (glibc 2.35, g++-12; packaging/linux/floor) so they run on Ubuntu 22.04,
  # Debian 12 and everything newer: the portable tar.gz, the AppImage (with
  # GTK, GLib and GStreamer inside), the deb and rpm (nFPM) and the AUR
  # PKGBUILD. FFmpeg 7.1 and the FFMS2 fork are built from source there.
  # The artifact hikarisub-linux-packages holds the files under their release
  # asset names, plus aur/PKGBUILD and aur/.SRCINFO for a stable version.
  linux-packages:
    name: Linux packages
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.keys.outputs.version }}
      stable: ${{ steps.keys.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve the cache keys
        id: keys
        run: |
          version=$(sed -n 's/^#define[[:space:]]*VersionHikariSub[[:space:]]*"\(.*\)".*/\1/p' HikariSub/VersionHikariSub.h)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$([[ "$version" == *-* ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          image=$(cat packaging/linux/floor/image)
          echo "image=${image##*@sha256:}" >> "$GITHUB_OUTPUT"
          echo "wx=$(git rev-parse HEAD:Thirdparty/wxWidgets)" >> "$GITHUB_OUTPUT"
          echo "ffms2=$(git rev-parse HEAD:Thirdparty/ffms2)" >> "$GITHUB_OUTPUT"

      # Keyed by the container image digest too: these are built in the floor
      # container and must never mix with the ubuntu-24.04 job's builds.
      - name: Cache wxWidgets (floor)
        id: wx-cache
        uses: actions/cache/restore@v4
        with:
          path: floor-out/wx/prefix
          key: wx-floor-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.wx }}-${{ hashFiles('Thirdparty/build-wxwidgets-linux.sh', 'packaging/linux/floor/build.sh', 'packaging/linux/floor/Dockerfile', 'packaging/linux/floor/install-deps.sh') }}

      - name: Cache FFmpeg and FFMS2 (floor)
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: floor-out/media
          key: media-floor-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.ffms2 }}-${{ hashFiles('packaging/linux/floor/sources.lock', 'packaging/linux/floor/build-media.sh', 'packaging/linux/floor/Dockerfile', 'packaging/linux/floor/install-deps.sh') }}

      - name: Build the floor container
        run: docker build -q --build-arg BASE="$(cat packaging/linux/floor/image)" -t hikarisub-floor packaging/linux/floor

      - name: Build the packages
        timeout-minutes: 120
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" hikarisub-floor \
            sh -c 'rc=0; packaging/linux/floor/build.sh "$PWD/floor-out" "$(nproc)" || rc=$?; chown -R "$1" floor-out; exit $rc' \
            sh "$(id -u):$(id -g)"

      - name: Save wxWidgets (floor)
        if: always() && steps.wx-cache.outputs.cache-hit != 'true' && hashFiles('floor-out/wx/prefix/bin/wx-config') != ''
        uses: actions/cache/save@v4
        with:
          path: floor-out/wx/prefix
          key: wx-floor-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.wx }}-${{ hashFiles('Thirdparty/build-wxwidgets-linux.sh', 'packaging/linux/floor/build.sh', 'packaging/linux/floor/Dockerfile', 'packaging/linux/floor/install-deps.sh') }}

      - name: Save FFmpeg and FFMS2 (floor)
        if: always() && steps.media-cache.outputs.cache-hit != 'true' && hashFiles('floor-out/media/lib/pkgconfig/ffms2.pc') != ''
        uses: actions/cache/save@v4
        with:
          path: floor-out/media
          key: media-floor-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.ffms2 }}-${{ hashFiles('packaging/linux/floor/sources.lock', 'packaging/linux/floor/build-media.sh', 'packaging/linux/floor/Dockerfile', 'packaging/linux/floor/install-deps.sh') }}

      - name: Collect the release files
        env:
          VERSION: ${{ steps.keys.outputs.version }}
        run: |
          mkdir -p linux-packages
          d=floor-out/app/dist
          cp "$d/hikarisub-linux-x86_64.tar.gz" "linux-packages/hikarisub-$VERSION-linux-x86_64.tar.gz"
          cp "$d/HikariSub-$VERSION-linux-x86_64.AppImage" "$d/HikariSub-$VERSION-linux-x86_64.AppImage.zsync" \
             "$d/hikarisub-$VERSION-linux-amd64.deb" "$d/hikarisub-$VERSION-linux-x86_64.rpm" linux-packages/
          for f in linux-packages/*; do
            [[ "$(basename "$f")" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::bad asset name $f"; exit 1; }
          done
          (cd linux-packages && sha256sum * | tee ../linux-packages.sha256)

      # The payload rules of the installers spec (5.1, 5.2): glibc 2.35 at
      # most, $ORIGIN-only RPATHs, nothing from packaging/linux/appimage/host-libs.txt.
      - name: Check the payloads
        env:
          VERSION: ${{ steps.keys.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm2cpio cpio rpm
          mkdir -p check/tar check/deb check/rpm
          tar -xzf "linux-packages/hikarisub-$VERSION-linux-x86_64.tar.gz" -C check/tar
          dpkg-deb -x "linux-packages/hikarisub-$VERSION-linux-amd64.deb" check/deb
          (cd check/rpm && rpm2cpio "../../linux-packages/hikarisub-$VERSION-linux-x86_64.rpm" | cpio -idm --quiet --no-absolute-filenames)
          (cd check && "../linux-packages/HikariSub-$VERSION-linux-x86_64.AppImage" --appimage-extract >/dev/null)
          for tree in check/tar check/deb check/rpm check/squashfs-root; do
            tests/packaging/linux/check-payload.sh "$tree" 2.35
          done
          # The versions inside the packages (installers spec, 1.3).
          debver=$(dpkg-deb -f "linux-packages/hikarisub-$VERSION-linux-amd64.deb" Version)
          rpmver=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "linux-packages/hikarisub-$VERSION-linux-x86_64.rpm")
          expected="$(sed 's/-/~/' <<<"$VERSION")-1"
          echo "deb $debver, rpm $rpmver, expected $expected"
          [[ "$debver" == "$expected" && "$rpmver" == "$expected" ]]
          dpkg --compare-versions 0.0.9-1 lt 0.1.0~beta.1-1
          dpkg --compare-versions 0.1.0~beta.1-1 lt 0.1.0-1
          [[ "$(rpm --eval '%{lua: print(rpm.vercmp("0.0.9-1", "0.1.0~beta.1-1") .. rpm.vercmp("0.1.0~beta.1-1", "0.1.0-1"))}')" == "-1-1" ]]
          dpkg-deb -I "linux-packages/hikarisub-$VERSION-linux-amd64.deb"
          rpm -qp --requires --recommends "linux-packages/hikarisub-$VERSION-linux-x86_64.rpm"
          # The dependencies came through (resolve-deps.sh and the maps).
          dpkg-deb -f "linux-packages/hikarisub-$VERSION-linux-amd64.deb" Depends | grep -q 'libgtk-3-0'
          dpkg-deb -f "linux-packages/hikarisub-$VERSION-linux-amd64.deb" Depends | grep -q 'gstreamer1.0-plugins-good'
          rpm -qp --requires "linux-packages/hikarisub-$VERSION-linux-x86_64.rpm" | grep -q 'libgtk-3.so.0()(64bit)'
          # The update information the AppImage carries for external updaters.
          grep -a -q 'gh-releases-zsync|altqx|hikari|latest|HikariSub-\*-linux-x86_64.AppImage.zsync' \
            "linux-packages/HikariSub-$VERSION-linux-x86_64.AppImage"

      # A stable version gets the AUR files the owner commits and pushes
      # (installers spec, 5.5). A prerelease is never rendered; its run
      # renders a test PKGBUILD for X.Y.Z offline, only for the container test.
      - name: Render the AUR package
        env:
          VERSION: ${{ steps.keys.outputs.version }}
          STABLE: ${{ steps.keys.outputs.stable }}
        run: |
          if [[ "$STABLE" == true ]]; then
            packaging/linux/aur/render-pkgbuild.sh "$VERSION" "linux-packages/hikarisub-$VERSION-linux-x86_64.tar.gz" linux-packages/aur
            aur_dir=linux-packages/aur aur_version=$VERSION
          else
            aur_version=${VERSION%%-*}
            mkdir -p aur-test
            cp "linux-packages/hikarisub-$VERSION-linux-x86_64.tar.gz" "aur-test/hikarisub-$aur_version-linux-x86_64.tar.gz"
            packaging/linux/aur/render-pkgbuild.sh --offline "$aur_version" "aur-test/hikarisub-$aur_version-linux-x86_64.tar.gz" aur-test/aur
          fi
          cat linux-packages/aur/PKGBUILD 2>/dev/null || cat aur-test/aur/PKGBUILD

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: hikarisub-linux-packages
          path: linux-packages
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload the test helpers
        run: |
          mkdir -p test-helpers
          cp -a floor-out/test/. test-helpers/
          if [[ -d aur-test ]]; then cp -a aur-test test-helpers/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: hikarisub-linux-package-tests
          path: test-helpers
          include-hidden-files: true
          if-no-files-found: error

  # Installs and starts each package in clean containers of the distributions
  # it targets (installers spec, 8.1 and 8.2; tests/packaging/linux).
  linux-package-tests:
    name: Linux package test (${{ matrix.test }}, ${{ matrix.image }})
    needs: linux-packages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { test: appimage, image: ubuntu-22.04 }
          - { test: appimage, image: ubuntu-24.04 }
          - { test: appimage, image: debian-12 }
          - { test: appimage, image: fedora }
          - { test: appimage, image: tumbleweed }
          - { test: appimage, image: archlinux }
          - { test: deb, image: ubuntu-22.04 }
          - { test: deb, image: ubuntu-24.04 }
          - { test: deb, image: debian-12 }
          - { test: rpm, image: fedora }
          - { test: rpm, image: tumbleweed }
          - { test: tar, image: ubuntu-22.04 }
          - { test: tar, image: ubuntu-24.04 }
          - { test: aur, image: archlinux }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hikarisub-linux-packages
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: hikarisub-linux-package-tests
          path: helpers

      - name: Test
        env:
          VERSION: ${{ needs.linux-packages.outputs.version }}
          STABLE: ${{ needs.linux-packages.outputs.stable }}
        run: |
          args=(--gst-check helpers/gst-check)
          case "${{ matrix.test }}" in
            deb|rpm) args+=(--upgrade helpers/upgrade) ;;
          esac
          dist=dist version=$VERSION
          if [[ "${{ matrix.test }}" == aur ]]; then
            if [[ "$STABLE" == true ]]; then
              args+=(--aur dist/aur)
            else
              version=${VERSION%%-*}
              dist=helpers/aur-test
              args+=(--aur helpers/aur-test/aur)
            fi
          fi
          tests/packaging/linux/run.sh "${args[@]}" "${{ matrix.test }}" "${{ matrix.image }}" "$dist" "$version"

  # Runs alongside the builds so a tag that does not match the source fails
  # straight away rather than after them.
  release-version:
    name: Release version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Match the tag against VersionHikariSub
        id: version
        run: |
          version=$(sed -n 's/^#define[[:space:]]*VersionHikariSub[[:space:]]*"\(.*\)".*/\1/p' HikariSub/VersionHikariSub.h)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VersionHikariSub \"$version\"; tag v$version instead."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: [release-version, tests, windows-tests, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The Windows artifact is the unarchived package directory, since
      # upload-artifact zips it anyway.
      - name: Assemble the release files
        run: |
          mkdir release
          (cd artifacts/hikarisub-windows-x64 && zip -qr "$OLDPWD/release/HikariSub-$VERSION-windows-x64.zip" HikariSub_x64)
          cp artifacts/hikarisub-linux-x86_64/hikarisub-linux-x86_64.tar.gz "release/hikarisub-$VERSION-linux-x86_64.tar.gz"
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --title "v$VERSION"
          --generate-notes
          ${{ needs.release-version.outputs.prerelease == 'true' && '--prerelease' || '--latest' }}
