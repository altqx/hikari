name: Build

on:
  # Only legacy on push. Branches in this repository with an open pull request
  # would otherwise be built twice for one commit, once per event.  A v* tag
  # builds and publishes a release.
  push:
    branches: [legacy]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      offer_to:
        description: 'A manual run of a tag: the release manifest offer_to (comma list of legacy and qt)'
        required: false
        default: ''

concurrency:
  # head_ref on a pull_request, ref otherwise, so a branch and its PR share one
  # group and the older run is cancelled rather than running alongside.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # DependencyControl's DownloadManager module links libcurl; gettext
      # checks the catalogs against the sources.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcurl4-openssl-dev gettext

      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-tests -j"$(nproc)"

      - name: Run
        run: ctest --test-dir build-tests --output-on-failure

  # The deb and rpm update helper (installers spec, 4.4), run as pkexec
  # would in the pinned test images: stand-in packages, and a stand-in for
  # GitHub that serves made-up releases' SHA256SUMS.
  update-helper-tests:
    name: Update helper (${{ matrix.kind }}, ${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: deb, image: ubuntu-22.04 }
          - { kind: deb, image: ubuntu-24.04 }
          - { kind: rpm, image: fedora }
          - { kind: rpm, image: tumbleweed }
    steps:
      - uses: actions/checkout@v4

      - name: Run
        run: |
          image=$(packaging/linux/fetch-tool.sh --image "${{ matrix.image }}")
          docker run --rm -v "$PWD:/src:ro" "$image" sh /src/tests/update/helper/test-update-helper.sh "${{ matrix.kind }}"

  # The tests of the save code that is Windows' own, which needs no
  # dependency and builds in a minute.
  windows-tests:
    name: Windows tests
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tests -B build-tests -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build-tests --config Release

      - name: Run
        env:
          HIKARISUB_TEST_NETWORK: '1' # the installing side's real fetch of a release's SHA256SUMS
        run: ctest --test-dir build-tests -C Release --output-on-failure

  windows:
    name: Windows (${{ matrix.configuration }}|x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Libass.vcxproj lists libass's sources by hand. A libass update that
      # adds one fails here, before the build, rather than at the link.
      - name: Check Libass.vcxproj against libass's source lists
        run: python .github/scripts/check-libass-vcxproj.py

      - uses: microsoft/setup-msbuild@v2

      # NASM, YASM and gettext come from their own release downloads, pinned
      # with their SHA-256s in packaging/windows/build-tools.lock, not from
      # Chocolatey: its community feed failed runs with 5xx and 504 answers.
      # The downloads are cached under their versions and SHA-256s, and
      # fetch-build-tools.ps1 checks a cached file's SHA-256 as it checks a
      # downloaded one's.
      - name: Resolve the pinned build tools
        id: build-tools
        run: |
          $lock = @{}
          foreach ($line in Get-Content packaging/windows/build-tools.lock) {
            if ($line -match '^([A-Z0-9_]+)=(.*)$') { $lock[$Matches[1]] = $Matches[2] }
          }
          $key = 'build-tools'
          foreach ($tool in 'NASM', 'YASM', 'GETTEXT') {
            $key += "-$($tool.ToLowerInvariant())-$($lock["${tool}_VERSION"])-$($lock["${tool}_SHA256"].Substring(0, 16))"
          }
          echo "key=$key" >> $env:GITHUB_OUTPUT
          echo "downloads=${{ runner.temp }}\build-tools-downloads" >> $env:GITHUB_OUTPUT
          echo "tools=${{ runner.temp }}\build-tools" >> $env:GITHUB_OUTPUT

      - name: Cache the build tool downloads
        id: build-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.build-tools.outputs.downloads }}
          key: ${{ steps.build-tools.outputs.key }}

      # The libass fork's assembly (Thirdparty/Build/Libass/nasm.targets) and
      # the VirtualDub libraries' SIMD kernels, through the vsyasm
      # integration the xy-VSFilter fork carries as src/YASM.{props,targets,xml},
      # call nasm and yasm from PATH. yasm publishes its Windows build as
      # yasm-1.2.0-win64.exe, not as an installer; it is saved as yasm.exe.
      - name: Install NASM and YASM
        run: >
          ./packaging/windows/fetch-build-tools.ps1
          -Downloads '${{ steps.build-tools.outputs.downloads }}'
          -Tools '${{ steps.build-tools.outputs.tools }}'
          -Name NASM, YASM

      # msgfmt compiles Locale/*.po into the .mo files HikariSub loads at run time;
      # the pre-build event skips that when msgfmt is missing.  Non-fatal, so a
      # download hiccup costs the artifact its translations, not the build.
      - name: Install gettext
        continue-on-error: true
        run: |
          ./packaging/windows/fetch-build-tools.ps1 `
            -Downloads '${{ steps.build-tools.outputs.downloads }}' `
            -Tools '${{ steps.build-tools.outputs.tools }}' `
            -Name GETTEXT

          # Look for msgfmt.exe itself, as the step did when it came from
          # Chocolatey, so a missing one fails here with its own message.
          $dir = @("${{ steps.build-tools.outputs.tools }}\gettext\bin") |
            Where-Object { Test-Path (Join-Path $_ 'msgfmt.exe') } |
            Select-Object -First 1

          if (-not $dir) {
            throw 'msgfmt.exe is not where gettext installs it; the package will ship without compiled catalogs'
          }

          $env:PATH = "$dir;$env:PATH"
          (Get-Command msgfmt).Source
          msgfmt --version

      - name: Check NASM and YASM
        run: |
          (Get-Command nasm).Source
          nasm -v
          (Get-Command yasm).Source
          yasm --version

      # D3DXCreateFontW / D3DXCreateLine live in the June 2010 DirectX SDK,
      # which no Windows SDK replaced and no runner image carries.  Its
      # installer fails on modern images (error S1023) because a newer VC++
      # 2010 redistributable is already present, so extract the payload
      # instead: only Include and Lib are needed.  HikariSub.vcxproj reads
      # DXSDK_DIR.
      - name: Cache DirectX SDK
        id: dxsdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/dxsdk
          key: dxsdk-jun2010-headers-libs-v1

      - name: Fetch DirectX SDK (June 2010)
        if: steps.dxsdk-cache.outputs.cache-hit != 'true'
        run: |
          $url = 'https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe'
          Invoke-WebRequest -Uri $url -OutFile dxsdk.exe -UseBasicParsing
          & 7z x dxsdk.exe -oraw -y '*\Include\*' '*\Lib\*' | Out-Null
          $inc = Get-ChildItem raw -Recurse -Directory -Filter Include | Select-Object -First 1
          $lib = Get-ChildItem raw -Recurse -Directory -Filter Lib     | Select-Object -First 1
          if (-not $inc -or -not $lib) { throw 'DirectX SDK payload did not contain Include/Lib' }
          Remove-Item dxsdk -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dxsdk | Out-Null
          Move-Item $inc.FullName dxsdk\Include
          Move-Item $lib.FullName dxsdk\Lib
          Remove-Item raw, dxsdk.exe -Recurse -Force

      - name: Point the build at the DirectX SDK
        run: |
          if (-not (Test-Path "dxsdk\Lib\x64\d3dx9.lib")) { throw 'd3dx9.lib missing from the extracted SDK' }
          echo "DXSDK_DIR=${{ github.workspace }}\dxsdk\" >> $env:GITHUB_ENV

      # hydrate.ps1 pulls ~200 MB of archives whose contents are pinned by
      # SHA-256, so the manifest is a sound cache key.
      - name: Cache hydrated dependencies
        id: hydrate-cache
        uses: actions/cache/restore@v4
        with:
          path: Thirdparty/.cache
          key: hydrate-${{ hashFiles('Thirdparty/dependencies.json') }}

      # Verbatim from the manifest + hydrate.ps1, and with no restore-key prefix:
      # hydrate.ps1 only checks marker files, so a stale tree restored under a
      # shared prefix would be skipped rather than noticed.
      - name: Cache hydrated dependency trees
        id: hydrate-trees-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Thirdparty/boost
            Thirdparty/icu
            Thirdparty/ffmpeg
            Thirdparty/fribidi
            Thirdparty/zlib
            Thirdparty/curl
          key: hydrate-trees-${{ hashFiles('Thirdparty/dependencies.json', 'Thirdparty/hydrate.ps1') }}

      # wxWidgets takes the bulk of the bootstrap time and only changes when
      # the submodule pin moves.
      - name: Resolve the wxWidgets pin
        id: wx-pin
        run: echo "sha=$(git rev-parse HEAD:Thirdparty/wxWidgets)" >> $env:GITHUB_OUTPUT

      - name: Cache wxWidgets libraries
        id: wx-cache
        uses: actions/cache/restore@v4
        with:
          path: Thirdparty/wxWidgets/lib
          key: wx2-${{ matrix.configuration }}-${{ steps.wx-pin.outputs.sha }}-${{ hashFiles('Thirdparty/build-wxwidgets.ps1') }}

      # A cache hit is not proof the libraries are usable: the save step below
      # used to run on failed runs too, so a partial lib/ could be cached and
      # then restored over a build that was skipped because of it. Check for
      # the header the build actually needs.
      - name: Check the restored wxWidgets libraries
        id: wx-check
        run: |
          $setup = "Thirdparty/wxWidgets/lib/vc_x64_lib/mswu/wx/setup.h"
          $usable = Test-Path -LiteralPath $setup
          if (-not $usable -and '${{ steps.wx-cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host "::warning::wxWidgets cache hit but $setup is missing; rebuilding."
          }
          echo "usable=$($usable.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Bootstrap
        run: >
          pwsh -File Thirdparty\bootstrap.ps1
          -Configuration ${{ matrix.configuration }}
          ${{ steps.wx-check.outputs.usable == 'true' && '-SkipWxWidgets' || '' }}

      - name: Build
        timeout-minutes: 90
        run: msbuild HikariSub.sln /m /v:minimal /p:Configuration=${{ matrix.configuration }} /p:Platform=x64

      # The package ships both executables.  The AVX configuration is built here
      # rather than as a solution configuration: MSBuild's mapping of Rel_AVX512
      # gives some dependencies a static runtime (Kasumi.lib), which the dynamic
      # one this application uses cannot link against (LNK2038/LNK1319).  Built
      # with the project references already produced above, the AVX executable
      # links against the Release libraries, whose runtime matches.
      - name: Build the AVX configuration
        if: matrix.configuration == 'Release'
        timeout-minutes: 60
        run: msbuild HikariSub.sln /m /v:minimal /t:HikariSub /p:Configuration=Rel_AVX512 /p:Platform=x64 /p:BuildProjectReferences=false


      # actions/cache only saves when the job succeeds (post-if: success()), and
      # every Windows job here has failed at least once on the way to a green
      # build, so nothing was ever cached.  Restore above, save here with
      # if: always(), which is what makes a failing run still worth something.
      - name: Save the build tool downloads
        if: always() && steps.build-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.build-tools.outputs.downloads }}
          key: ${{ steps.build-tools.outputs.key }}

      - name: Save DirectX SDK
        if: always() && steps.dxsdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/dxsdk
          key: dxsdk-jun2010-headers-libs-v1

      - name: Save hydrated dependencies
        if: always() && steps.hydrate-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Thirdparty/.cache
          key: hydrate-${{ hashFiles('Thirdparty/dependencies.json') }}

      - name: Save hydrated dependency trees
        if: always() && steps.hydrate-trees-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Thirdparty/boost
            Thirdparty/icu
            Thirdparty/ffmpeg
            Thirdparty/fribidi
            Thirdparty/zlib
            Thirdparty/curl
          key: hydrate-trees-${{ hashFiles('Thirdparty/dependencies.json', 'Thirdparty/hydrate.ps1') }}

      - name: Save wxWidgets libraries
        if: success() && steps.wx-check.outputs.usable != 'true'
        uses: actions/cache/save@v4
        with:
          path: Thirdparty/wxWidgets/lib
          key: wx2-${{ matrix.configuration }}-${{ steps.wx-pin.outputs.sha }}-${{ hashFiles('Thirdparty/build-wxwidgets.ps1') }}

      - name: Check the executable exists
        run: |
          $exe = "x64\${{ matrix.configuration }}\HikariSub.exe"
          if (-not (Test-Path $exe)) { throw "not built: $exe" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      # The xy-VSFilter renderer just built, called through CSRI as HikariSub
      # calls it (tests/CsriXyVSFilterTests.cpp).
      - name: Test the CSRI renderer
        if: matrix.configuration == 'Release'
        run: |
          $dll = Join-Path $PWD 'x64\Release\csri\xy-Vsfilter.dll'
          if (-not (Test-Path $dll)) { throw "not built: $dll" }
          cmake -S tests -B build-csri-tests -G "Visual Studio 17 2022" -A x64 "-DHIKARISUB_TESTS_XYVSFILTER=$dll"
          cmake --build build-csri-tests --config Release --target hikarisub_csri_tests
          ctest --test-dir build-csri-tests -C Release -R '^hikarisub_csri_tests$' --output-on-failure

      # The artifact is the shippable package: binaries plus the runtime data
      # (Automation 4 library, dictionaries, locales, CSRI renderers and the
      # runtimes Windows does not always have) assembled by .github/scripts/package.py
      # from pinned public repositories -- see runtime-assets.json.
      - name: Package the runtime
        if: matrix.configuration == 'Release'
        run: python .github/scripts/package.py --platform windows --build-dir x64/Release --stage "dist/HikariSub_x64" --no-archive

      - name: Upload the package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: hikarisub-windows-x64
          path: dist
          if-no-files-found: error

  # The NSIS installer, built on Linux from the Release package above with
  # makensis built from source: windows-2025 images carry no NSIS, and the Qt branch
  # builds the same script the same way. The artifact holds the release
  # names of the setup and the portable zip.
  windows-installer:
    name: Windows installer
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # makensis itself is built by build-installer.sh (build-makensis.sh,
      # the version and SHA-256s in tools.lock): Ubuntu's nsis is 3.09,
      # which has CVE-2025-43715.
      - name: Install the tools to build makensis
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends scons g++ zlib1g-dev bzip2 unzip p7zip-full

      - uses: actions/download-artifact@v4
        with:
          name: hikarisub-windows-x64
          path: artifacts

      - name: Build the installer
        run: |
          version=$(sed -n 's/^#define[[:space:]]*VersionHikariSub[[:space:]]*"\(.*\)".*/\1/p' HikariSub/VersionHikariSub.h)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          packaging/windows/build-installer.sh \
            --payload artifacts/HikariSub_x64 --version "$version" --codebase legacy \
            --icon HikariSub/Bitmaps/HikariLargeIcon.ico --icon-header HikariSub/FileTypeIcons.h \
            --out "installer/HikariSub-$version-windows-x64-setup.exe" --work nsis-work

      # The uninstaller's elevation rule, built alone for the Windows test
      # (tests/packaging/windows/protected-tests.ps1).
      - name: Build the elevation rule test
        run: HS_MAKENSIS="nsis-work/nsis-$(sed -n 's/^MAKENSIS_VERSION=//p' packaging/windows/tools.lock)/Bin/makensis" tests/packaging/windows/build-protected-test.sh nsis-work/protected-test.exe

      # 7-Zip reads NSIS installers. Every payload file must be inside,
      # byte for byte, and nothing else but the installer's own files; the
      # manifest it writes must list exactly the payload.
      - name: Check the installer contents
        run: |
          setup="installer/HikariSub-$VERSION-windows-x64-setup.exe"
          7z x -y -onsis-check "$setup" > /dev/null
          (cd artifacts/HikariSub_x64 && find . -type f | sed 's|^\./||' | LC_ALL=C sort) > payload.txt
          (cd nsis-check && find . -type f | sed 's|^\./||' | LC_ALL=C sort) |
            grep -vx -e 'install-manifest.txt' -e 'Uninstall HikariSub.exe' -e '\$PLUGINSDIR/.*' > packed.txt
          diff payload.txt packed.txt
          tr -d '\r' < nsis-check/install-manifest.txt | tr '\\' '/' | LC_ALL=C sort > manifest.txt
          diff payload.txt manifest.txt
          while IFS= read -r f; do
            cmp "artifacts/HikariSub_x64/$f" "nsis-check/$f"
          done < payload.txt
          test -f 'nsis-check/$PLUGINSDIR/StdUtils.dll'
          ls -l "$setup"

      - name: Zip the portable package
        run: (cd artifacts && zip -qr "$OLDPWD/installer/HikariSub-$VERSION-windows-x64.zip" HikariSub_x64)

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: hikarisub-windows-installer
          path: installer/*
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config ninja-build gettext \
            libgtk-3-dev \
            libffms2-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libhunspell-dev libuchardet-dev libcurl4-openssl-dev \
            libicu-dev libboost-all-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            autoconf automake libtool nasm \
            libfreetype-dev libfribidi-dev libharfbuzz-dev libfontconfig-dev

      # The app links and bundles the libass fork in Thirdparty/libass, as
      # the release packages do, never the distribution's libass.
      - name: Build the libass fork
        run: Thirdparty/build-libass-linux.sh "" "$(nproc)"

      # Only the install prefix is consumed (CMakeLists.txt finds wx-config
      # there), so that is all that is cached.
      - name: Resolve the wxWidgets pin
        id: wx-pin
        run: |
          echo "sha=$(git rev-parse HEAD:Thirdparty/wxWidgets)" >> "$GITHUB_OUTPUT"
          echo "prefix=${{ matrix.build_type == 'Debug' && 'build-wx-linux-debug' || 'build-wx-linux' }}/prefix" >> "$GITHUB_OUTPUT"

      - name: Cache wxWidgets
        id: wx-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.wx-pin.outputs.prefix }}
          key: wx-linux-ubuntu-24.04-${{ matrix.build_type }}-${{ steps.wx-pin.outputs.sha }}-${{ hashFiles('Thirdparty/build-wxwidgets-linux.sh', 'Thirdparty/wxWidgets-patches/**') }}

      - name: Check the restored wxWidgets
        id: wx-check
        run: |
          wx_config="${{ steps.wx-pin.outputs.prefix }}/bin/wx-config"
          if [[ -x "$wx_config" ]] && "$wx_config" --version >/dev/null; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            if [[ '${{ steps.wx-cache.outputs.cache-hit }}' == 'true' ]]; then
              echo "::warning::wxWidgets cache hit but $wx_config is unusable; rebuilding."
            fi
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build pinned wxWidgets 3.3.4
        if: steps.wx-check.outputs.usable != 'true'
        run: Thirdparty/build-wxwidgets-linux.sh ${{ matrix.build_type == 'Debug' && '--debug' || '' }}

      # Saved straight after the build so a later failure still keeps it.
      - name: Save wxWidgets
        if: steps.wx-check.outputs.usable != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.wx-pin.outputs.prefix }}
          key: wx-linux-ubuntu-24.04-${{ matrix.build_type }}-${{ steps.wx-pin.outputs.sha }}-${{ hashFiles('Thirdparty/build-wxwidgets-linux.sh', 'Thirdparty/wxWidgets-patches/**') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Validate the desktop integration
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream libxml2-utils
          cmake --install build --prefix "$PWD/stage"
          desktop-file-validate stage/share/applications/io.github.altqx.HikariSub.desktop
          appstreamcli validate --no-net stage/share/metainfo/io.github.altqx.HikariSub.metainfo.xml
          xmllint --noout stage/share/mime/packages/hikarisub.xml
          # Icon= must actually resolve, or the launcher shows a blank tile.
          for size in 16x16 32x32 48x48 64x64 128x128 256x256; do
            test -f "stage/share/icons/hicolor/$size/apps/hikarisub.png"
          done

      - name: Check the executable exists
        run: test -x build/hikarisub && ls -l build/hikarisub

      - name: Package the runtime
        if: matrix.build_type == 'Release'
        run: |
          cmake --build build --target hikarisub_linux_package
          mkdir -p build/package-check
          tar -xzf build/dist/hikarisub-linux-x86_64.tar.gz -C build/package-check
          package=build/package-check/hikarisub-linux-x86_64
          test -x "$package/hikarisub"
          test -f "$package/libwx_gtk3u_core-3.3.so.4"
          test -f "$package/HikariSub/Bitmaps/HideTags.png"
          test -f "$package/Automation/automation/Autoload/strip-tags.lua"
          test -f "$package/Automation/automation/Include/BM/BadMutex/libBadMutex.so"
          test -f "$package/Automation/automation/Include/PT/PreciseTimer/libPreciseTimer.so"
          test -f "$package/Automation/automation/Include/DM/DownloadManager/libDownloadManager.so"
          test -f "$package/Automation/automation/Include/SubInspector/Inspector/libSubInspector.so"
          # Inspector.moon must load the packaged library and measure lines.
          sudo apt-get install -y --no-install-recommends luajit libluajit-5.1-dev pkg-config fonts-dejavu-core
          tests/subinspector/check-package.sh "$package"
          test -f "$package/Themes/DeepDark.txt"
          (cd "$package" && sha256sum -c SHA256SUMS)
          (cd build/dist && sha256sum -c hikarisub-linux-x86_64.tar.gz.sha256)
          spaced_package="build/package-check/hikarisub with spaces"
          mv "$package" "$spaced_package"
          XDG_DATA_HOME="$PWD/build/package-check/desktop data" \
            "$spaced_package/install-desktop-integration.sh"
          desktop="build/package-check/desktop data/applications/io.github.altqx.HikariSub.desktop"
          desktop-file-validate "$desktop"
          grep -Fx "Exec=\"$PWD/$spaced_package/hikarisub\" %f" "$desktop"

      - name: Upload the package
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: hikarisub-linux-x86_64
          path: build/dist/hikarisub-linux-x86_64.tar.gz*
          if-no-files-found: error

  # The release packages for Linux, built in the ubuntu:22.04 floor container
  # (glibc 2.35, g++-12; packaging/linux/floor) so they run on Ubuntu 22.04,
  # Debian 12 and everything newer: the portable tar.gz, the AppImage (with
  # GTK, GLib and GStreamer inside), the deb and rpm (nFPM) and the AUR
  # PKGBUILDs. FFmpeg 7.1 and the FFMS2 fork are built from source there.
  # The artifact hikarisub-linux-packages holds the files under their release
  # asset names; hikarisub-linux-package-tests holds the rendered AUR
  # packages (aur-test/<package>) for the container test.
  linux-packages:
    name: Linux packages
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.keys.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve the cache keys
        id: keys
        run: |
          version=$(sed -n 's/^#define[[:space:]]*VersionHikariSub[[:space:]]*"\(.*\)".*/\1/p' HikariSub/VersionHikariSub.h)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          image=$(cat packaging/linux/floor/image)
          echo "image=${image##*@sha256:}" >> "$GITHUB_OUTPUT"
          echo "wx=$(git rev-parse HEAD:Thirdparty/wxWidgets)" >> "$GITHUB_OUTPUT"
          echo "ffms2=$(git rev-parse HEAD:Thirdparty/ffms2)" >> "$GITHUB_OUTPUT"
          echo "libass=$(git rev-parse HEAD:Thirdparty/libass)" >> "$GITHUB_OUTPUT"

      # Keyed by the container image digest too: these are built in the floor
      # container and must never mix with the ubuntu-24.04 job's builds.
      - name: Cache wxWidgets (floor)
        id: wx-cache
        uses: actions/cache/restore@v4
        with:
          path: floor-out/wx/prefix
          key: wx-floor-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.wx }}-${{ hashFiles('Thirdparty/build-wxwidgets-linux.sh', 'Thirdparty/wxWidgets-patches/**', 'packaging/linux/floor/build.sh', 'packaging/linux/floor/Dockerfile', 'packaging/linux/floor/install-deps.sh') }}

      - name: Cache FFmpeg, FFMS2 and libass (floor)
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: floor-out/media
          key: media-floor-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.ffms2 }}-${{ steps.keys.outputs.libass }}-${{ hashFiles('packaging/linux/floor/sources.lock', 'packaging/linux/floor/build-media.sh', 'Thirdparty/build-libass-linux.sh', 'packaging/linux/floor/Dockerfile', 'packaging/linux/floor/install-deps.sh') }}

      - name: Build the floor container
        run: docker build -q --build-arg BASE="$(cat packaging/linux/floor/image)" -t hikarisub-floor packaging/linux/floor

      - name: Build the packages
        timeout-minutes: 120
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" hikarisub-floor \
            sh -c 'rc=0; packaging/linux/floor/build.sh "$PWD/floor-out" "$(nproc)" || rc=$?; chown -R "$1" floor-out; exit $rc' \
            sh "$(id -u):$(id -g)"

      - name: Save wxWidgets (floor)
        if: always() && steps.wx-cache.outputs.cache-hit != 'true' && hashFiles('floor-out/wx/prefix/bin/wx-config') != ''
        uses: actions/cache/save@v4
        with:
          path: floor-out/wx/prefix
          key: wx-floor-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.wx }}-${{ hashFiles('Thirdparty/build-wxwidgets-linux.sh', 'Thirdparty/wxWidgets-patches/**', 'packaging/linux/floor/build.sh', 'packaging/linux/floor/Dockerfile', 'packaging/linux/floor/install-deps.sh') }}

      - name: Save FFmpeg, FFMS2 and libass (floor)
        if: always() && steps.media-cache.outputs.cache-hit != 'true' && hashFiles('floor-out/media/lib/pkgconfig/ffms2.pc') != '' && hashFiles('floor-out/media/lib/pkgconfig/libass.pc') != ''
        uses: actions/cache/save@v4
        with:
          path: floor-out/media
          key: media-floor-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.ffms2 }}-${{ steps.keys.outputs.libass }}-${{ hashFiles('packaging/linux/floor/sources.lock', 'packaging/linux/floor/build-media.sh', 'Thirdparty/build-libass-linux.sh', 'packaging/linux/floor/Dockerfile', 'packaging/linux/floor/install-deps.sh') }}

      - name: Collect the release files
        env:
          VERSION: ${{ steps.keys.outputs.version }}
        run: |
          mkdir -p linux-packages
          d=floor-out/app/dist
          cp "$d/hikarisub-linux-x86_64.tar.gz" "linux-packages/hikarisub-$VERSION-linux-x86_64.tar.gz"
          cp "$d/HikariSub-$VERSION-linux-x86_64.AppImage" "$d/HikariSub-$VERSION-linux-x86_64.AppImage.zsync" \
             "$d/hikarisub-$VERSION-linux-amd64.deb" "$d/hikarisub-$VERSION-linux-x86_64.rpm" linux-packages/
          for f in linux-packages/*; do
            [[ "$(basename "$f")" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::bad asset name $f"; exit 1; }
          done
          (cd linux-packages && sha256sum * | tee ../linux-packages.sha256)

      # The payload rules of the installers spec (5.1, 5.2): glibc 2.35 at
      # most, $ORIGIN-only RPATHs, nothing from packaging/linux/appimage/host-libs.txt.
      - name: Check the payloads
        env:
          VERSION: ${{ steps.keys.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm2cpio cpio rpm
          mkdir -p check/tar check/deb check/rpm
          tar -xzf "linux-packages/hikarisub-$VERSION-linux-x86_64.tar.gz" -C check/tar
          dpkg-deb -x "linux-packages/hikarisub-$VERSION-linux-amd64.deb" check/deb
          (cd check/rpm && rpm2cpio "../../linux-packages/hikarisub-$VERSION-linux-x86_64.rpm" | cpio -idm --quiet --no-absolute-filenames)
          (cd check && "../linux-packages/HikariSub-$VERSION-linux-x86_64.AppImage" --appimage-extract >/dev/null)
          for tree in check/tar check/deb check/rpm check/squashfs-root; do
            tests/packaging/linux/check-payload.sh "$tree" 2.35
          done
          # The versions inside the packages (installers spec, 1.3).
          debver=$(dpkg-deb -f "linux-packages/hikarisub-$VERSION-linux-amd64.deb" Version)
          rpmver=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "linux-packages/hikarisub-$VERSION-linux-x86_64.rpm")
          expected="$(sed 's/-/~/' <<<"$VERSION")-1"
          echo "deb $debver, rpm $rpmver, expected $expected"
          [[ "$debver" == "$expected" && "$rpmver" == "$expected" ]]
          dpkg --compare-versions 0.0.9-1 lt 0.1.0~beta.1-1
          dpkg --compare-versions 0.1.0~beta.1-1 lt 0.1.0-1
          [[ "$(rpm --eval '%{lua: print(rpm.vercmp("0.0.9-1", "0.1.0~beta.1-1") .. rpm.vercmp("0.1.0~beta.1-1", "0.1.0-1"))}')" == "-1-1" ]]
          dpkg-deb -I "linux-packages/hikarisub-$VERSION-linux-amd64.deb"
          rpm -qp --requires --recommends "linux-packages/hikarisub-$VERSION-linux-x86_64.rpm"
          # The dependencies came through (resolve-deps.sh and the maps).
          dpkg-deb -f "linux-packages/hikarisub-$VERSION-linux-amd64.deb" Depends | grep -q 'libgtk-3-0'
          dpkg-deb -f "linux-packages/hikarisub-$VERSION-linux-amd64.deb" Depends | grep -q 'gstreamer1.0-plugins-good'
          rpm -qp --requires "linux-packages/hikarisub-$VERSION-linux-x86_64.rpm" | grep -q 'libgtk-3.so.0()(64bit)'
          # The update information the AppImage carries for external updaters.
          grep -a -q 'gh-releases-zsync|altqx|hikari|latest|HikariSub-\*-linux-x86_64.AppImage.zsync' \
            "linux-packages/HikariSub-$VERSION-linux-x86_64.AppImage"

      # The AUR packages this version goes to (installers spec, 5.5), rendered
      # offline from this build's tar.gz for the container test:
      # hikarisub-beta-bin always, hikarisub-stable-bin too for a stable
      # version. The release job renders the published tar.gz and publishes.
      - name: Render the AUR packages
        env:
          VERSION: ${{ steps.keys.outputs.version }}
        run: |
          for package in $(packaging/linux/aur/render-pkgbuild.sh --packages "$VERSION"); do
            packaging/linux/aur/render-pkgbuild.sh --offline "$package" "$VERSION" \
              "linux-packages/hikarisub-$VERSION-linux-x86_64.tar.gz" "aur-test/$package"
            cat "aur-test/$package/PKGBUILD"
          done

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: hikarisub-linux-packages
          path: linux-packages
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload the test helpers
        run: |
          mkdir -p test-helpers
          cp -a floor-out/test/. test-helpers/
          cp -a aur-test test-helpers/

      - uses: actions/upload-artifact@v4
        with:
          name: hikarisub-linux-package-tests
          path: test-helpers
          include-hidden-files: true
          if-no-files-found: error

  # Installs and starts each package in clean containers of the distributions
  # it targets (installers spec, 8.1 and 8.2; tests/packaging/linux).
  linux-package-tests:
    name: Linux package test (${{ matrix.test }}, ${{ matrix.image }})
    needs: linux-packages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { test: appimage, image: ubuntu-22.04 }
          - { test: appimage, image: ubuntu-24.04 }
          - { test: appimage, image: debian-12 }
          - { test: appimage, image: fedora }
          - { test: appimage, image: tumbleweed }
          - { test: appimage, image: archlinux }
          - { test: deb, image: ubuntu-22.04 }
          - { test: deb, image: ubuntu-24.04 }
          - { test: deb, image: debian-12 }
          - { test: rpm, image: fedora }
          - { test: rpm, image: tumbleweed }
          - { test: tar, image: ubuntu-22.04 }
          - { test: tar, image: ubuntu-24.04 }
          - { test: aur, image: archlinux }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hikarisub-linux-packages
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: hikarisub-linux-package-tests
          path: helpers

      - name: Test
        env:
          VERSION: ${{ needs.linux-packages.outputs.version }}
        run: |
          args=(--gst-check helpers/gst-check)
          case "${{ matrix.test }}" in
            deb|rpm) args+=(--upgrade helpers/upgrade) ;;
          esac
          if [[ "${{ matrix.test }}" == aur ]]; then
            args+=(--aur helpers/aur-test/hikarisub-beta-bin)
          fi
          tests/packaging/linux/run.sh "${args[@]}" "${{ matrix.test }}" "${{ matrix.image }}" dist "$VERSION"

  # The AUR scripts (packaging/linux/aur) without the AUR: the channel rules,
  # pkgver, the downgrade and newest-release refusals, and publishing to
  # local repositories (installers spec, 8.2).
  aur-scripts:
    name: AUR scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: tests/packaging/linux/aur-scripts-test.sh

  # Runs alongside the builds so a tag that does not match the source fails
  # straight away rather than after them. Legacy stays at 0.0.x, and a
  # release version has no build metadata.
  release-version:
    name: Release version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Match the tag against VersionHikariSub
        id: version
        run: |
          version=$(sed -n 's/^#define[[:space:]]*VersionHikariSub[[:space:]]*"\(.*\)".*/\1/p' HikariSub/VersionHikariSub.h)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VersionHikariSub \"$version\"; tag v$version instead."
            exit 1
          fi
          if [[ "$version" == *+* ]]; then
            echo "::error::$version has build metadata, which a release version does not."
            exit 1
          fi
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$identifier(\.$identifier)*)?$ ]]; then
            echo "::error::$version is not a semantic version."
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != 0 || "${BASH_REMATCH[2]}" != 0 ]]; then
            echo "::error::$version is 0.1.0 or higher, which is the Qt codebase's; legacy stays at 0.0.x."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Publishes the release, then its update manifest, then the AUR packages
  # (installers spec, section 7). The packages come from the linux-packages
  # and windows-installer jobs under their release names.
  release:
    name: Release
    needs: [release-version, tests, windows-tests, update-helper-tests, windows, windows-installer, linux, linux-packages, linux-package-tests, aur-scripts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-version.outputs.version }}
      PRERELEASE: ${{ needs.release-version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble the release files
        run: |
          mkdir release
          for artifact in hikarisub-windows-installer hikarisub-linux-packages; do
            if [[ ! -d "artifacts/$artifact" ]]; then
              echo "::error::The $artifact artifact is missing."
              exit 1
            fi
          done
          names=(
            "HikariSub-$VERSION-windows-x64-setup.exe"
            "HikariSub-$VERSION-windows-x64.zip"
            "HikariSub-$VERSION-linux-x86_64.AppImage"
            "HikariSub-$VERSION-linux-x86_64.AppImage.zsync"
            "hikarisub-$VERSION-linux-amd64.deb"
            "hikarisub-$VERSION-linux-x86_64.rpm"
            "hikarisub-$VERSION-linux-x86_64.tar.gz"
          )
          for name in "${names[@]}"; do
            found=$(find artifacts/hikarisub-windows-installer artifacts/hikarisub-linux-packages -type f -name "$name" | head -n 1)
            if [[ -n "$found" ]]; then
              cp "$found" "release/$name"
            fi
          done
          # Today's tar.gz, when the packages job does not carry it.
          tarball="release/hikarisub-$VERSION-linux-x86_64.tar.gz"
          if [[ ! -f "$tarball" ]]; then
            cp artifacts/hikarisub-linux-x86_64/hikarisub-linux-x86_64.tar.gz "$tarball"
          fi
          for name in "${names[@]}"; do
            if [[ ! -f "release/$name" ]]; then
              echo "::error::release/$name is missing."
              exit 1
            fi
            if ! [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "::error::$name is not a valid asset name."
              exit 1
            fi
          done
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      # A test build reads its update feed from the environment; a release
      # never does. The name is looked for as UTF-8, UTF-16 and UTF-32, the
      # forms wide strings take on Windows and Linux.
      - name: Check no test feed is built in
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm2cpio cpio
          mkdir -p scan/tar scan/deb scan/rpm scan/appimage
          tar -xzf "release/hikarisub-$VERSION-linux-x86_64.tar.gz" -C scan/tar
          dpkg-deb -x "release/hikarisub-$VERSION-linux-amd64.deb" scan/deb
          (cd scan/rpm && rpm2cpio "$OLDPWD/release/hikarisub-$VERSION-linux-x86_64.rpm" | cpio -idm --quiet --no-absolute-filenames)
          appimage="$PWD/release/HikariSub-$VERSION-linux-x86_64.AppImage"
          chmod +x "$appimage"
          (cd scan/appimage && "$appimage" --appimage-extract > /dev/null)
          python3 - artifacts/hikarisub-windows-x64 scan <<'PY'
          import os, sys
          needle = "HIKARISUB_UPDATE_FEED"
          forms = [needle.encode("utf-8"), needle.encode("utf-16-le"), needle.encode("utf-32-le")]
          found = []
          for root in sys.argv[1:]:
              for folder, _, files in os.walk(root):
                  for name in files:
                      path = os.path.join(folder, name)
                      if os.path.islink(path) or not os.path.isfile(path):
                          continue
                      with open(path, "rb") as file:
                          data = file.read()
                      if any(form in data for form in forms):
                          found.append(path)
          for path in found:
              print(f"::error::{path} contains {needle}: it is a test build.")
          sys.exit(1 if found else 0)
          PY

      # A draft first: clients see the release only once its update manifest
      # is there (published below). Without one they would fall back to the
      # assets' digests, without the manifest's offer_to and requirements.
      - name: Create the release as a draft
        run: |
          flag=()
          [[ "$PRERELEASE" == true ]] && flag=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --title "v$VERSION" --generate-notes "${flag[@]}"

      - name: Read the asset names back
        run: |
          find release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > uploaded.txt
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | LC_ALL=C sort > published.txt
          if ! diff uploaded.txt published.txt; then
            echo "::error::GitHub changed the asset names."
            exit 1
          fi

      # A legacy release is offered to legacy clients only, unless a manual
      # run of the tag says otherwise. HIKARISUB_OFFER_QT_TO_LEGACY is for
      # Qt releases.
      - name: Publish the update manifest
        env:
          OFFER_TO: ${{ github.event.inputs.offer_to || 'legacy' }}
        run: |
          mkdir manifest
          python3 tools/release/make-update-manifest.py --tag "$GITHUB_REF_NAME" --dir release \
            --offer-to "$OFFER_TO" --output manifest/hikarisub-update.json --upload

      # --latest only for the highest stable version published, so a later
      # legacy release does not become Latest over a Qt one.
      - name: Publish the release
        run: |
          if [[ "$PRERELEASE" == true ]]; then
            flag=--latest=false
          else
            highest=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V | tail -n 1)
            if [[ -z "$highest" || "$(printf '%s\n%s\n' "$highest" "$VERSION" | sort -V | tail -n 1)" == "$VERSION" ]]; then
              flag=--latest=true
            else
              flag=--latest=false
            fi
          fi
          echo "Publishing with $flag"
          gh release edit "$GITHUB_REF_NAME" --draft=false "$flag"

      # The AUR packages (installers spec, 5.5), while they follow legacy
      # (until HIKARISUB_OFFER_QT_TO_LEGACY): hikarisub-beta-bin for every
      # release, hikarisub-stable-bin too for a stable one. Each is rendered
      # from the published tar.gz, built and started in the pinned archlinux
      # container from the published URL, then pushed to the AUR. A missing
      # or refused key, a newer version on the AUR or a newer release of the
      # channel is a warning: the release is out already, and the owner can
      # publish it later with the AUR publish workflow (aur-publish.yml).
      - name: Publish to the AUR
        if: vars.HIKARISUB_OFFER_QT_TO_LEGACY != 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | {tag_name, draft, prerelease}' | jq -s . > releases.json
          packaging/linux/aur/release-aur.sh --releases releases.json \
            "$VERSION" "release/hikarisub-$VERSION-linux-x86_64.tar.gz" aur-artifact

      - name: Upload the AUR files
        if: always() && vars.HIKARISUB_OFFER_QT_TO_LEGACY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hikarisub-aur
          path: aur-artifact/
          include-hidden-files: true
          if-no-files-found: warn
