name: Release

# A v* tag of main (0.1.0 or higher) builds the packages, publishes the release, its update manifest, then the AUR packages.
# offer_to stays ["qt"]: legacy 0.0.2-rc.1 and later install a release that names legacy without asking;
# legacy users get an opt-in `offer` instead (ADR-0021).
# Only the called workflows' provisioning steps receive the Qt installer secret.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      offer_channel:
        description: 'The offer to legacy users: auto (a prerelease on prerelease, a stable release on stable), prerelease, stable, or none'
        type: choice
        options: [auto, prerelease, stable, none]
        default: auto
      offer_legacy_support:
        description: 'The offer says legacy support continues, or has ended'
        type: choice
        options: [continues, ended]
        default: continues
      offer_pitch:
        description: 'The pitch, a JSON file in the tree; empty is packaging/offer/<version>.json'
        type: string
        default: ''
      dry_run:
        description: 'Build and publish nothing: check the version and the offer and write the manifest from stand-in packages (any ref)'
        type: boolean
        default: false
      dry_run_version:
        description: 'A dry run: the version whose manifest is written'
        type: string
        default: '0.1.0-beta.1'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag's prerelease part is HIKARI_VERSION_SUFFIX; the part before it must be the CMake project version.
  release-version:
    name: Release version
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry_run
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      offer_channel: ${{ steps.offer.outputs.channel }}
      offer_legacy_support: ${{ steps.offer.outputs.legacy_support }}
      offer_pitch: ${{ steps.offer.outputs.pitch }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Match the tag against the project version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DRY_RUN_VERSION: ${{ inputs.dry_run_version }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then
            version="$DRY_RUN_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ "$version" == *+* ]]; then
            echo "::error::$version has build metadata, which a release version does not."
            exit 1
          fi
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-($identifier(\.$identifier)*))?$ ]]; then
            echo "::error::$version is not a semantic version."
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" == 0 && "${BASH_REMATCH[2]}" == 0 ]]; then
            echo "::error::$version is 0.0.x, which is legacy's; HikariSub starts at 0.1.0."
            exit 1
          fi
          core="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          suffix="${BASH_REMATCH[5]}"
          project=$(sed -n 's/^project(HikariSub VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          if [[ "$core" != "$project" ]]; then
            echo "::error::Tag v$version does not match the project version $project."
            exit 1
          fi
          {
            echo "version=$version"
            echo "suffix=$suffix"
            echo "prerelease=$([[ -n "$suffix" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Check the offer
        id: offer
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          CHANNEL_INPUT: ${{ inputs.offer_channel }}
          SUPPORT_INPUT: ${{ inputs.offer_legacy_support }}
          PITCH_INPUT: ${{ inputs.offer_pitch }}
        run: |
          set -euo pipefail
          channel=${CHANNEL_INPUT:-auto}
          if [[ "$channel" == auto ]]; then
            channel=$([[ "$PRERELEASE" == true ]] && echo prerelease || echo stable)
          fi
          support=${SUPPORT_INPUT:-continues}
          pitch=${PITCH_INPUT:-packaging/offer/$VERSION.json}
          if [[ "$channel" == none ]]; then
            echo "::warning::v$VERSION is published without an offer to legacy users."
          else
            if [[ "$pitch" == /* || "$pitch" == *..* || ! "$pitch" =~ ^[A-Za-z0-9._/-]+\.json$ ]]; then
              echo "::error::The pitch $pitch is not a JSON file in the tree."
              exit 1
            fi
            if [[ ! -f "$pitch" ]]; then
              echo "::error::There is no pitch at $pitch. Add the owner-approved pitch there, or run the tag with offer_channel none to publish without an offer."
              exit 1
            fi
            python3 tools/release/make-update-manifest.py --tag "v$VERSION" --check-offer \
              --offer-channel "$channel" --offer-legacy-support "$support" --offer-pitch "$pitch"
          fi
          {
            echo "channel=$channel"
            echo "legacy_support=$support"
            echo "pitch=$pitch"
          } >> "$GITHUB_OUTPUT"

      # Legacy 0.0.1 reads no manifest and shows these notes, so they open by saying moving is optional (ADR-0021).
      - name: Write the notes' first line
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUPPORT: ${{ steps.offer.outputs.legacy_support }}
        run: |
          set -euo pipefail
          legacy=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
            grep -E '^v0\.0\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [[ -z "$legacy" ]]; then
            echo "::error::No stable legacy release was found for the notes."
            exit 1
          fi
          link="[$legacy](https://github.com/$GH_REPO/releases/tag/$legacy)"
          if [[ "$SUPPORT" == ended ]]; then
            notes="Coming from 0.0.x? Moving is optional; legacy keeps working but gets no further updates. The last legacy release is $link."
          else
            notes="Coming from 0.0.x? Moving is optional; legacy keeps getting updates. The latest legacy release is $link."
          fi
          echo "$notes"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux packages
    needs: release-version
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/package-linux.yml
    with:
      version_suffix: ${{ needs.release-version.outputs.suffix }}
      release: true
    secrets:
      QT_INSTALLER_JWT_TOKEN: ${{ secrets.QT_INSTALLER_JWT_TOKEN }}
      HIKARI_POSTHOG_KEY: ${{ secrets.HIKARI_POSTHOG_KEY }} # AN1 (#404)

  windows:
    name: Windows packages
    needs: release-version
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/package-windows.yml
    with:
      version: ${{ needs.release-version.outputs.version }}
      release: true
    secrets:
      QT_INSTALLER_JWT_TOKEN: ${{ secrets.QT_INSTALLER_JWT_TOKEN }}
      HIKARI_POSTHOG_KEY: ${{ secrets.HIKARI_POSTHOG_KEY }} # AN1 (#404)

  release:
    name: Release
    needs: [release-version, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-version.outputs.version }}
      PRERELEASE: ${{ needs.release-version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Check the packages carry the tag's version
        env:
          LINUX_VERSION: ${{ needs.linux.outputs.version }}
          WINDOWS_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          for got in "$LINUX_VERSION" "$WINDOWS_VERSION"; do
            if [[ "$got" != "$VERSION" ]]; then
              echo "::error::A package job built $got, not $VERSION."
              exit 1
            fi
          done

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hikarisub-linux-packages
          path: artifacts/linux

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hikarisub-windows-installer
          path: artifacts/windows

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hikarisub-linux-symbols
          path: artifacts/linux-symbols

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hikarisub-windows-symbols
          path: artifacts/windows-symbols

      - name: Assemble the release files
        run: |
          set -euo pipefail
          mkdir release
          names=(
            "HikariSub-$VERSION-windows-x64-setup.exe"
            "HikariSub-$VERSION-windows-x64.zip"
            "HikariSub-$VERSION-linux-x86_64.AppImage"
            "HikariSub-$VERSION-linux-x86_64.AppImage.zsync"
            "hikarisub-$VERSION-linux-amd64.deb"
            "hikarisub-$VERSION-linux-x86_64.rpm"
            "hikarisub-$VERSION-linux-x86_64.tar.gz"
            "hikarisub-docs-$VERSION.zip"
            "hikarisub-symbols-$VERSION-linux-x86_64.tar.xz"
            "HikariSub-$VERSION-windows-x64-symbols.zip"
          )
          for name in "${names[@]}"; do
            if ! [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "::error::$name is not a valid asset name."
              exit 1
            fi
            found=$(find artifacts -type f -name "$name" | head -n 1)
            if [[ -z "$found" ]]; then
              echo "::error::$name is missing from the package artifacts."
              exit 1
            fi
            cp "$found" "release/$name"
          done
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      # Wide strings are UTF-16 on Windows and UTF-32 on Linux, so the name is searched for in every encoding.
      - name: Check no test feed is built in
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools unzip
          mkdir -p scan/tar scan/deb scan/rpm scan/appimage scan/zip
          tar -xzf "release/hikarisub-$VERSION-linux-x86_64.tar.gz" -C scan/tar
          dpkg-deb -x "release/hikarisub-$VERSION-linux-amd64.deb" scan/deb
          bsdtar -xf "release/hikarisub-$VERSION-linux-x86_64.rpm" -C scan/rpm
          appimage="$PWD/release/HikariSub-$VERSION-linux-x86_64.AppImage"
          chmod +x "$appimage"
          (cd scan/appimage && "$appimage" --appimage-extract > /dev/null)
          unzip -q "release/HikariSub-$VERSION-windows-x64.zip" -d scan/zip
          python3 - scan "release/HikariSub-$VERSION-windows-x64-setup.exe" <<'PY'
          import os, sys
          needle = "HIKARISUB_UPDATE_FEED"
          forms = [needle.encode("utf-8"), needle.encode("utf-16-le"), needle.encode("utf-32-le")]
          paths = []
          for root in sys.argv[1:]:
              if os.path.isfile(root):
                  paths.append(root)
              for folder, _, files in os.walk(root):
                  paths.extend(os.path.join(folder, name) for name in files)
          found = []
          for path in paths:
              if os.path.islink(path) or not os.path.isfile(path):
                  continue
              with open(path, "rb") as file:
                  data = file.read()
              if any(form in data for form in forms):
                  found.append(path)
          for path in found:
              print(f"::error::{path} contains {needle}: it is a test build.")
          sys.exit(1 if found else 0)
          PY

      - name: Upload the symbols to PostHog
        continue-on-error: true
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.HIKARI_POSTHOG_SYMBOLS_KEY }}
          POSTHOG_CLI_PROJECT_ID: '323949'
          POSTHOG_CLI_HOST: https://eu.posthog.com
        run: |
          set -uo pipefail
          if [[ -z "$POSTHOG_CLI_API_KEY" ]]; then
            echo "::warning::No HIKARI_POSTHOG_SYMBOLS_KEY: crashes in this release show unresolved frames."
            exit 0
          fi
          mkdir -p posthog-symbols/linux posthog-symbols/windows
          failed=0
          tar -xJf "release/hikarisub-symbols-$VERSION-linux-x86_64.tar.xz" -C posthog-symbols/linux || failed=1
          unzip -q "release/HikariSub-$VERSION-windows-x64-symbols.zip" -d posthog-symbols/windows || failed=1
          for os in linux windows; do
            python3 tools/crash/posthog_symbols.py "posthog-symbols/$os" || failed=1
          done
          if (( failed )); then
            echo "::warning::Some symbols did not reach PostHog: their crashes show unresolved frames."
          fi

      # Draft first: clients see the release only once its manifest is up; before that they fall back to the asset digests.
      - name: Create the release as a draft
        env:
          NOTES: ${{ needs.release-version.outputs.notes }}
        run: |
          set -euo pipefail
          flag=()
          [[ "$PRERELEASE" == true ]] && flag=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --title "v$VERSION" \
            --notes "$NOTES" --generate-notes "${flag[@]}"

      - name: Read the asset names back
        run: |
          find release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > uploaded.txt
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | LC_ALL=C sort > published.txt
          if ! diff uploaded.txt published.txt; then
            echo "::error::GitHub changed the asset names."
            exit 1
          fi

      - name: Publish the update manifest
        env:
          OFFER_CHANNEL: ${{ needs.release-version.outputs.offer_channel }}
          OFFER_LEGACY_SUPPORT: ${{ needs.release-version.outputs.offer_legacy_support }}
          OFFER_PITCH: ${{ needs.release-version.outputs.offer_pitch }}
        run: |
          set -euo pipefail
          offer=()
          if [[ "$OFFER_CHANNEL" != none ]]; then
            offer=(--offer-channel "$OFFER_CHANNEL" --offer-legacy-support "$OFFER_LEGACY_SUPPORT" --offer-pitch "$OFFER_PITCH")
          fi
          mkdir manifest
          python3 tools/release/make-update-manifest.py --tag "$GITHUB_REF_NAME" --dir release \
            "${offer[@]}" --output manifest/hikarisub-update.json --upload

      - name: Refuse a manifest not offered to qt only
        run: python3 tools/release/make-update-manifest.py --tag "$GITHUB_REF_NAME" --verify manifest/hikarisub-update.json

      # --latest only for the highest stable version, so HikariSub and HikariSub legacy releases don't take Latest from each other.
      - name: Publish the release
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == true ]]; then
            flag=--latest=false
          else
            highest=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V | tail -n 1)
            if [[ -z "$highest" || "$(printf '%s\n%s\n' "$highest" "$VERSION" | sort -V | tail -n 1)" == "$VERSION" ]]; then
              flag=--latest=true
            else
              flag=--latest=false
            fi
          fi
          echo "Publishing with $flag"
          gh release edit "$GITHUB_REF_NAME" --draft=false "$flag"

      # A failure here is only a warning: the release is out, and aur-publish.yml can publish the AUR packages later.
      - name: Publish to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | {tag_name, draft, prerelease}' | jq -s . > releases.json
          packaging/linux/aur/release-aur.sh --releases releases.json \
            "$VERSION" "release/hikarisub-$VERSION-linux-x86_64.tar.gz" aur-artifact

      - name: Upload the AUR files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hikarisub-aur
          path: aur-artifact/
          include-hidden-files: true
          if-no-files-found: warn

  dry-run:
    name: Dry run
    needs: release-version
    if: inputs.dry_run
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.release-version.outputs.version }}
      OFFER_CHANNEL: ${{ needs.release-version.outputs.offer_channel }}
      OFFER_LEGACY_SUPPORT: ${{ needs.release-version.outputs.offer_legacy_support }}
      OFFER_PITCH: ${{ needs.release-version.outputs.offer_pitch }}
      NOTES: ${{ needs.release-version.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Check the symbol upload packs on this runner
        run: |
          set -euo pipefail
          mkdir symbols-check
          printf 'int main(void) { return 0; }\n' | gcc -g -Wl,--build-id -x c - -o symbols-check/probe
          python3 tools/crash/posthog_symbols.py symbols-check --dry-run

      - name: Write the update manifest from stand-in packages
        run: |
          set -euo pipefail
          mkdir release manifest
          for name in "HikariSub-$VERSION-windows-x64-setup.exe" "HikariSub-$VERSION-windows-x64.zip" \
              "HikariSub-$VERSION-linux-x86_64.AppImage" "hikarisub-$VERSION-linux-amd64.deb" \
              "hikarisub-$VERSION-linux-x86_64.rpm" "hikarisub-$VERSION-linux-x86_64.tar.gz"; do
            echo "stand-in for $name" > "release/$name"
          done
          python3 - release > assets.json <<'PY'
          import hashlib, json, os, sys
          assets = []
          for name in sorted(os.listdir(sys.argv[1])):
              with open(os.path.join(sys.argv[1], name), "rb") as file:
                  data = file.read()
              assets.append({"name": name, "size": len(data), "digest": "sha256:" + hashlib.sha256(data).hexdigest()})
          print(json.dumps({"assets": assets}))
          PY
          offer=()
          if [[ "$OFFER_CHANNEL" != none ]]; then
            offer=(--offer-channel "$OFFER_CHANNEL" --offer-legacy-support "$OFFER_LEGACY_SUPPORT" --offer-pitch "$OFFER_PITCH")
          fi
          python3 tools/release/make-update-manifest.py --tag "v$VERSION" --dir release --assets-json assets.json \
            "${offer[@]}" --output manifest/hikarisub-update.json
          {
            echo "The notes open with: $NOTES"
            echo
            echo '```json'
            cat manifest/hikarisub-update.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse a manifest not offered to qt only
        run: python3 tools/release/make-update-manifest.py --tag "v$VERSION" --verify manifest/hikarisub-update.json

      - name: Check a bad offer_to is refused
        run: |
          set -euo pipefail
          for offer_to in qt,legacy legacy; do
            if python3 tools/release/make-update-manifest.py --tag "v$VERSION" --dir release --assets-json assets.json \
                --offer-to "$offer_to" --output bad.json; then
              echo "::error::A manifest with offer_to $offer_to was written."
              exit 1
            fi
            jq --arg to "$offer_to" '.offer_to = ($to | split(","))' manifest/hikarisub-update.json > bad.json
            if python3 tools/release/make-update-manifest.py --tag "v$VERSION" --verify bad.json; then
              echo "::error::A manifest with offer_to $offer_to passed the check."
              exit 1
            fi
            echo "offer_to $offer_to: refused"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hikarisub-update-manifest-dry-run
          path: manifest/hikarisub-update.json
          if-no-files-found: error

  # A job of its own that runs nothing from the repository, so the site's token never meets the release's code.
  site:
    name: Tell the site
    needs: [release-version, release]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Request the site's rebuild
        env:
          SITE_TOKEN: ${{ secrets.HIKARI_SITE_DISPATCH_TOKEN }}
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$SITE_TOKEN" ]]; then
            echo "::warning::HIKARI_SITE_DISPATCH_TOKEN is not set; the site picks up v$VERSION at its daily build."
            exit 0
          fi
          if ! GH_TOKEN="$SITE_TOKEN" gh api repos/altqx/hikari-site/dispatches -f event_type=hikari-release \
              -f "client_payload[version]=$VERSION" -f "client_payload[tag]=$GITHUB_REF_NAME" \
              -f "client_payload[docs_asset]=hikarisub-docs-$VERSION.zip" > /dev/null; then
            echo "::warning::The site's rebuild was not requested; it picks up v$VERSION at its daily build."
          fi
