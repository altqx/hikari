name: Legacy capture

# E1: build the legacy wx app at the fixtures' pinned source baseline and record
# its observed behavior on the approved-departure fixtures. Characterization
# only; nothing here builds or tests the Qt rewrite.
on:
  push:
    branches: [qt]
    paths:
      - tools/legacy-capture/**
      - docs/qt/fixtures/approved-departures/**
      - .github/workflows/legacy-capture.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-capture-${{ github.ref }}
  cancel-in-progress: true

env:
  LEGACY_COMMIT: 20d647c4c769ab7f5d383cf3c1c33f03876a94e9

jobs:
  capture:
    name: Legacy Linux app at the pinned baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: rewrite
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: legacy
          ref: ${{ env.LEGACY_COMMIT }}
          submodules: recursive
          persist-credentials: false

      - name: Legacy build dependencies and capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config ninja-build gettext \
            libgtk-3-dev libluajit-5.1-dev libffms2-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libass-dev libhunspell-dev libuchardet-dev libcurl4-openssl-dev \
            libicu-dev libboost-all-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            xvfb xdotool imagemagick openbox > /dev/null

      - name: Resolve the wxWidgets pin
        id: wx-pin
        working-directory: legacy
        run: echo "sha=$(git rev-parse HEAD:Thirdparty/wxWidgets)" >> "$GITHUB_OUTPUT"

      - name: Restore wxWidgets
        id: wx-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: legacy/build-wx-linux/prefix
          key: legacy-capture-wx-ubuntu-24.04-${{ steps.wx-pin.outputs.sha }}-${{ hashFiles('legacy/Thirdparty/build-wxwidgets-linux.sh') }}

      - name: Build pinned wxWidgets 3.3.3
        if: steps.wx-cache.outputs.cache-hit != 'true'
        working-directory: legacy
        run: Thirdparty/build-wxwidgets-linux.sh

      # Saved straight after the build so a later failure still keeps it.
      - name: Save wxWidgets
        if: steps.wx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: legacy/build-wx-linux/prefix
          key: legacy-capture-wx-ubuntu-24.04-${{ steps.wx-pin.outputs.sha }}-${{ hashFiles('legacy/Thirdparty/build-wxwidgets-linux.sh') }}

      - name: Build and package the legacy app
        working-directory: legacy
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          cmake --build build --target hikarisub_linux_package

      - name: Build the legacy time probe
        run: |
          cmake -S rewrite/tools/legacy-capture -B probe -G Ninja \
            -DLEGACY_SOURCE="$PWD/legacy" -DWX_CONFIG="$PWD/legacy/build-wx-linux/prefix/bin/wx-config"
          cmake --build probe

      - name: Capture observations
        run: |
          set -euo pipefail
          mkdir -p capture
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          sleep 2
          # A window manager, so xdotool can activate and focus the app window.
          DISPLAY=:99 openbox > /dev/null 2>&1 &
          sleep 1
          export LD_LIBRARY_PATH="$PWD/legacy/build-wx-linux/prefix/lib:${LD_LIBRARY_PATH:-}"
          python3 rewrite/tools/legacy-capture/drive.py \
            --fixtures rewrite/docs/qt/fixtures/approved-departures \
            --plan rewrite/tools/legacy-capture/plan.json \
            --package legacy/build/dist/hikarisub-linux-x86_64.tar.gz \
            --probe probe/legacy_time_capture \
            --legacy-commit "$LEGACY_COMMIT" \
            --out capture/observations.json | tee capture/summary.json

      # The legacy package and its wx libraries, so a capture route can be
      # reproduced outside CI (an Ubuntu 24.04 container with Xvfb and openbox).
      - name: Bundle the legacy app for local reproduction
        if: always()
        run: |
          mkdir -p legacy-app
          cp legacy/build/dist/hikarisub-linux-x86_64.tar.gz legacy-app/ || true
          tar -C legacy/build-wx-linux/prefix -czf legacy-app/wx-prefix-lib.tar.gz lib || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: legacy-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: legacy-app/
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: legacy-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: capture/
          if-no-files-found: warn
          retention-days: 30
