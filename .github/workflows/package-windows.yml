name: Windows packages

# Installers SPEC 6 and 7: the Windows payload is built on windows-2025 (no
# tests), then the NSIS installer and the portable zip are made on Ubuntu with
# makensis 3.13 built from source (packaging/windows/build-makensis.sh),
# because windows-2025 images carry no NSIS and Ubuntu's 3.09 has CVE-2025-43715. The artifact
# hikarisub-windows-installer holds HikariSub-<V>-windows-x64-setup.exe and
# HikariSub-<V>-windows-x64.zip under their release names. release.yml
# calls this workflow with the release version.
on:
  push:
    branches: [main]
    paths:
      - cmake/HikariPackageWindows.cmake
      - src/app/CMakeLists.txt
      - src/app/windows/**
      - packaging/windows/**
      - .github/workflows/package-windows.yml
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (empty for <project version>-ci.<run number>)
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v
        type: string
        required: true
      release:
        description: A release build, which carries the usage data key (AN1 #404)
        type: boolean
        default: false
    secrets:
      QT_INSTALLER_JWT_TOKEN:
        required: true
      HIKARI_POSTHOG_KEY:
        required: false
    outputs:
      version:
        description: The version the packages carry
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      suffix: ${{ steps.v.outputs.suffix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # SPEC 1.2: SemVer, no build metadata, 0.1.0 or higher, and the part
      # before the prerelease is the CMake project version (the prerelease
      # becomes HIKARI_VERSION_SUFFIX).
      - name: Check the version against the project
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          project=$(sed -n 's/^project(HikariSub VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          [ -n "$project" ] || { echo "no project version in CMakeLists.txt"; exit 1; }
          version="${INPUT_VERSION#v}"
          [ -n "$version" ] || version="$project-ci.$RUN_NUMBER"
          python3 -I - "$version" "$project" <<'EOF'
          import re, sys
          v, project = sys.argv[1], sys.argv[2]
          m = re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
                           r"(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?", v)
          if not m:
              sys.exit(f"not a SemVer release version without build metadata: {v}")
          if (int(m[1]), int(m[2])) < (0, 1):
              sys.exit(f"{v} is below 0.1.0, which is legacy's range")
          if f"{m[1]}.{m[2]}.{m[3]}" != project:
              sys.exit(f"{v} does not match the project version {project}")
          EOF
          suffix=""
          case "$version" in *-*) suffix="${version#*-}" ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "version $version (suffix '${suffix}')"

  payload:
    name: Windows payload (windows-2025, latest MSVC)
    needs: version
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Latest MSVC developer environment
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the x64 C++ tools' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --no-progress -y | Out-Null }

      - name: Provision Qt and vcpkg (only step with the secret)
        env:
          QT_INSTALLER_JWT_TOKEN: ${{ secrets.QT_INSTALLER_JWT_TOKEN }}
        run: cmake --workflow --preset provision

      - name: Build and stage the payload without credentials
        env:
          SUFFIX: ${{ needs.version.outputs.suffix }}
          # AN1: release builds only (test packages send nothing).
          POSTHOG_KEY: ${{ inputs.release && secrets.HIKARI_POSTHOG_KEY || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path "$env:APPDATA\Qt\qtaccount.ini") { throw 'Qt account file left in the profile' }
          if (Test-Path out/sdk/qt-install-private) { throw 'Private install directory left behind' }
          # CR1 (#452): PDBs beside the build, kept as the version's symbols.
          cmake --preset windows-x64-package "-DHIKARI_VERSION_SUFFIX=$env:SUFFIX" "-DHIKARI_POSTHOG_KEY=$env:POSTHOG_KEY" -DHIKARI_DEBUG_SYMBOLS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-x64-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The payload must not name the test feed switch (SPEC 8.4) nor carry
      # files the installer writes itself.
      - name: Check the payload
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'out/build/windows-x64-package/payload/HikariSub'
          foreach ($f in 'HikariSub.exe', 'hikari-media-helper.exe', 'hikari-lua-helper.exe', 'Qt6Core.dll', 'vcruntime140.dll', 'msvcp140.dll', 'Dictionary/en_US.dic', 'Automation/automation', 'Csri/VSFiltermod.dll') {
            if (-not (Test-Path "$p/$f")) { throw "payload lacks $f" }
          }
          # xy-VSFilter is not shipped (user 2026-10-14): VSFilterMod is the only CSRI renderer.
          if (Test-Path "$p/Csri/xy-VSFilter_hikarisub.dll") { throw 'payload carries xy-VSFilter' }
          foreach ($f in 'package-kind.txt', 'install-manifest.txt') {
            if (Test-Path "$p/$f") { throw "payload carries $f" }
          }
          $pdbs = Get-ChildItem -Recurse -File $p -Filter *.pdb
          if ($pdbs) { throw "payload carries $($pdbs.Name -join ', ')" }
          $hits = Get-ChildItem -Recurse -File $p -Include *.exe, *.dll | Select-String -SimpleMatch -List -Pattern 'HIKARISUB_UPDATE_FEED'
          if ($hits) { throw "test feed switch in $($hits.Path -join ', ')" }
          Get-Content out/build/windows-x64-package/payload/payload-manifest.txt | Measure-Object -Line | ForEach-Object { "payload: $($_.Lines) files" }

      # CR1 (#452): the symbols, a release asset of their own: each payload
      # module the build has a PDB for, beside it. A forced crash of the
      # payload must symbolize with them (tools/crash/symbolize.py).
      - name: Symbols and a symbolized crash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $b = 'out/build/windows-x64-package'
          $p = "$b/payload/HikariSub"
          $s = 'out/symbols/HikariSub'
          New-Item -ItemType Directory -Force $s, out/evidence/crash | Out-Null
          $pdbs = Get-ChildItem -Recurse -File $b -Filter *.pdb | Where-Object { $_.FullName -notmatch '[\\/](payload|vcpkg_installed)[\\/]' }
          foreach ($m in Get-ChildItem -Recurse -File $p -Include *.exe, *.dll) {
            $pdb = $pdbs | Where-Object { $_.BaseName -eq $m.BaseName } | Select-Object -First 1
            if (-not $pdb) { continue }
            $rel = [IO.Path]::GetRelativePath((Resolve-Path $p), $m.DirectoryName)
            $dir = Join-Path $s $rel
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item $m.FullName, $pdb.FullName $dir
            "symbols: $rel/$($m.Name) + $($pdb.Name)"
          }
          if (-not (Test-Path "$s/HikariSub.pdb")) { throw 'no PDB for HikariSub.exe' }
          Compress-Archive -Path "$s/*" -DestinationPath "out/symbols/HikariSub-$env:VERSION-windows-x64-symbols.zip"
          Remove-Item -Recurse -Force $s
          Get-ChildItem out/symbols | Format-Table Name, Length
          Expand-Archive "out/symbols/HikariSub-$env:VERSION-windows-x64-symbols.zip" out/symbols-check
          $env:HIKARISUB_CRASH_TEST = 'segv'
          $proc = Start-Process -FilePath "$p/HikariSub.exe" -PassThru -RedirectStandardError out/evidence/crash/stderr.txt -RedirectStandardOutput out/evidence/crash/stdout.txt
          if (-not $proc.WaitForExit(180000)) { $proc.Kill(); throw 'the forced crash did not end the app' }
          Remove-Item Env:HIKARISUB_CRASH_TEST
          "exit $($proc.ExitCode)"
          $line = Select-String -Path out/evidence/crash/stderr.txt -Pattern '^HIKARISUB_CRASH_TEST=segv: record at (.+)$' | Select-Object -First 1
          if (-not $line) { Get-Content out/evidence/crash/stderr.txt; throw 'no record path on stderr' }
          $record = $line.Matches[0].Groups[1].Value.Trim()
          if (-not (Test-Path $record)) { throw "no crash record at $record" }
          Copy-Item $record out/evidence/crash/crash-record.txt
          Get-Content $record
          if (-not (Get-Command llvm-symbolizer -ErrorAction SilentlyContinue)) { $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH" }
          python tools/crash/symbolize.py $record --symbols out/symbols-check | Tee-Object out/evidence/crash/symbolized.txt
          if (-not (Select-String -Path out/evidence/crash/symbolized.txt -SimpleMatch -Quiet 'crashForTest')) { throw 'crashForTest was not symbolized' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hikarisub-windows-symbols
          path: out/symbols/HikariSub-${{ needs.version.outputs.version }}-windows-x64-symbols.zip
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hikarisub-windows-payload
          path: |
            out/build/windows-x64-package/payload/HikariSub/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/build/windows-x64-package/payload/payload-manifest.txt
            out/build/windows-x64-package/payload/windeployqt.log
            out/evidence/
          if-no-files-found: warn
          retention-days: 14

  installer:
    name: NSIS installer and portable zip (Ubuntu, makensis 3.13)
    needs: [version, payload]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hikarisub-windows-payload
          path: payload/HikariSub

      # makensis itself is built by build-installer.sh (build-makensis.sh,
      # the version and SHA-256s in tools.lock): Ubuntu's nsis is 3.09,
      # which has CVE-2025-43715.
      - name: Install the tools to build makensis, and 7-Zip
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends scons g++ zlib1g-dev bzip2 unzip p7zip-full

      - name: Build the installer
        run: |
          set -euo pipefail
          packaging/windows/build-installer.sh \
            --payload payload/HikariSub --version "$VERSION" --codebase qt \
            --icon src/app/windows/HikariLargeIcon.ico --icon-header src/app/windows/FileTypeIcons.h \
            --out "dist/HikariSub-$VERSION-windows-x64-setup.exe" --work nsis-work

      # The uninstaller's elevation rule, built alone for the Windows test
      # (tests/packaging/windows/protected-tests.ps1).
      - name: Build the elevation rule test
        run: HS_MAKENSIS="nsis-work/nsis-$(sed -n 's/^MAKENSIS_VERSION=//p' packaging/windows/tools.lock)/Bin/makensis" tests/packaging/windows/build-protected-test.sh nsis-work/protected-test.exe

      # 7-Zip reads NSIS installers: every payload file is inside byte for
      # byte, nothing else but the installer's own files, and the manifest it
      # writes lists exactly the payload (as legacy's windows-installer job).
      - name: Check the installer contents
        run: |
          set -euo pipefail
          setup="dist/HikariSub-$VERSION-windows-x64-setup.exe"
          7z x -y -onsis-check "$setup" > /dev/null
          (cd payload/HikariSub && find . -type f | sed 's|^\./||' | LC_ALL=C sort) > payload.txt
          (cd nsis-check && find . -type f | sed 's|^\./||' | LC_ALL=C sort) |
            grep -vx -e 'install-manifest.txt' -e 'Uninstall HikariSub.exe' -e '\$PLUGINSDIR/.*' > packed.txt
          diff payload.txt packed.txt
          tr -d '\r' < nsis-check/install-manifest.txt | tr '\\' '/' | LC_ALL=C sort > manifest.txt
          diff payload.txt manifest.txt
          while IFS= read -r f; do
            cmp "payload/HikariSub/$f" "nsis-check/$f"
          done < payload.txt
          test -f 'nsis-check/$PLUGINSDIR/StdUtils.dll'
          echo "$(wc -l < payload.txt) payload files in the installer"

      - name: Make the portable zip
        run: |
          set -euo pipefail
          # One HikariSub_x64 folder, as legacy's zip has.
          mkdir -p zipstage
          cp -a payload/HikariSub zipstage/HikariSub_x64
          (cd zipstage && zip -qrX "../dist/HikariSub-$VERSION-windows-x64.zip" HikariSub_x64)
          for f in dist/*; do
            name=$(basename "$f")
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "bad asset name: $name"; exit 1; }
          done
          (cd dist && sha256sum -- *)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hikarisub-windows-installer
          path: |
            dist/HikariSub-${{ needs.version.outputs.version }}-windows-x64-setup.exe
            dist/HikariSub-${{ needs.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
